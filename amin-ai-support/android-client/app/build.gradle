plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amin.support.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amin.support.mobile.compat'
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName '0.2.0-compat-test'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Open-source WSS transport; no paid API or embedded server secret.
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.13.1'
}
