plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amin.support.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amin.support.mobile'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '0.1.0-test'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Open-source WSS transport; no paid API or embedded server secret.
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
