plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.amin.support.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amin.support.mobile'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '0.1.0-test'
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }
    androidResources {
        noCompress 'onnx', 'mdl', 'fst', 'ark', 'res', 'conf', 'bin'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Open-source WSS transport; no paid API or embedded server secret.
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.13.1'
    // Persian ASR is fully offline and bundled inside this APK.
    implementation 'com.alphacephei:vosk-android:0.3.47'
    // Pinned offline ONNX runtime is provisioned by scripts/provision_persian_voice.sh.
    implementation files('libs/sherpa-onnx.aar')
}
