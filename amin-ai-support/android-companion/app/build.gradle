plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amin.javab.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amin.javab.companion'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '0.1.0-test'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
