plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amin.javab.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.amin.javab.companion'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '0.1.0-test'
    }

    sourceSets {
        main {
            // Reuse the existing JVM-tested canonical JavabActivationState.
            java.srcDirs += ['..']
            java.exclude('tests/**')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
