
name = "amin-ai-unified"
main = "src/index.mjs"
compatibility_date = "2026-11-22"
workers_dev = true
[ai]
binding = "AI"
[vars]
AMIN_AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
AMIN_DAILY_OWNER_CHAT_LIMIT = "60"
AMIN_DAILY_CUSTOMER_CHAT_LIMIT = "12"
OWNER_RENT_MONTHLY_MICROUSDT = "0"
PAYMENT_DESTINATION_VERIFIED = "0"
PAYMENT_RECEIVER_CONSENT = "0"
PAYMENT_RECEIVER_KIND = "exchange_unverified"
[[d1_databases]]
binding = "DB"
database_name = "amin-managed-subscriptions"
database_id = "REPLACE_BILLING_DB_ID"
[[d1_databases]]
binding = "KNOWLEDGE_DB"
database_name = "amin-ai-knowledge"
database_id = "REPLACE_KNOWLEDGE_DB_ID"
[triggers]
crons = ["*/5 * * * *"]
