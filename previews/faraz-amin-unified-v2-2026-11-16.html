<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فراز امین | کابین یکپارچه ارتقایافته</title><style>:root{font-family:Tahoma,Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081322;color:#e9f2fc}header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:20px;background:#0e2035;border-bottom:1px solid #34506b}header strong{font-size:23px;color:#f2c775}.tag{color:#e9c985;font-size:12px}.shell{display:flex;min-height:calc(100vh - 77px)}aside{width:235px;background:#101e31;padding:12px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}button{font:inherit;cursor:pointer;color:white;background:#225c88;border:1px solid #47749a;padding:11px 14px;border-radius:9px}.tab{text-align:right;background:transparent;border:0;color:#bdcfe0}.tab.active{background:#23476c;color:white}main{padding:23px;flex:1;min-width:0}.notice{padding:13px;background:#253348;border:1px solid #5a6d83;border-radius:10px;font-size:12px;color:#e4d9bb;margin:14px 0}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.cols,.screen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#142840;border:1px solid #304e6d;border-radius:13px;padding:19px;min-width:0;margin-bottom:14px}.card h3{margin:0 0 17px;font-size:16px}.card strong{font-size:24px;display:block;color:#6bdbb9}.card small,.muted{color:#a6bcd1;font-size:12px}.line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #30465c;padding:12px 0;font-size:13px}.line b{color:#f3d48f}.chartbox{background:#0b1b2e;border:1px dashed #58748e;min-height:200px;border-radius:10px;display:grid;place-content:center;text-align:center;color:#a9bdd2;line-height:2;padding:15px;margin:12px 0}.chartbox.tall{min-height:330px}.toolbar,.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;color:#b7cadd;font-size:13px;margin:8px 0}input,select,textarea{font:inherit;width:100%;padding:11px;background:#0b1b2e;color:white;border:1px solid #54718b;border-radius:8px;margin-top:7px}textarea{resize:vertical}h2{font-size:21px;margin:0 0 10px}@media(max-width:850px){.shell{display:block}aside{width:100%;flex-direction:row;overflow-x:auto}.tab{white-space:nowrap}.kpis,.cols,.screen{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:12px}}@media(max-width:520px){.kpis,.cols,.screen,.fields,.toolbar{grid-template-columns:1fr}header{display:block}.card{padding:13px}}</style></head><body><header><strong>◆ فراز امین | کابین یکپارچه</strong><span class="tag">نسخه آفلاین نمایشی · MT5 قطع · معامله واقعی غیرفعال</span></header><div class="shell"><aside><button class="tab" onclick="go(0)">◈ داشبورد</button><button class="tab" onclick="go(1)">▥ نمودار و تحلیل</button><button class="tab" onclick="go(2)">⇄ معاملات و سفارش‌ها</button><button class="tab" onclick="go(3)">⬡ مدیریت ریسک</button><button class="tab" onclick="go(4)">⚗ آزمایشگاه و بک‌تست</button><button class="tab" onclick="go(5)">▤ سرمایه و پرتفوی</button><button class="tab" onclick="go(6)">◷ تقویم اقتصادی</button><button class="tab" onclick="go(7)">▣ ویندوز و موبایل</button><button class="tab" onclick="go(8)">⚙ تنظیمات</button></aside><main><h2 id="heading">داشبورد</h2><div class="notice">این نسخه برای بررسی رابط کاربری است. هیچ قیمت، سود، سیگنال یا نتیجه آزمون زنده‌ای نمایش داده نمی‌شود.</div><div id="view"></div></main></div><script>const panels=["<div class=\"kpis\"><div class=\"card\"><h3>سرمایه مبنا</h3><strong>۱٬۰۰۰ $</strong><small>مقدار آزمایشی</small></div><div class=\"card\"><h3>سود و زیان</h3><strong>—</strong><small>حساب متصل نیست</small></div><div class=\"card\"><h3>وضعیت موتور</h3><strong>غیرفعال</strong><small>اجرای واقعی ندارد</small></div><div class=\"card\"><h3>توقف روزانه</h3><strong id='dashstop'>۵۰ $</strong><small>تنظیم نمایشی</small></div></div><div class=\"cols\"><div class=\"card\"><h3>نمودار طلا</h3><div class=\"chartbox\">برای نمایش نمودار واقعی، داده معتبر لازم است.</div><button onclick=\"go(1)\">ورود به تحلیل</button></div><div class=\"card\"><h3>وضعیت سامانه</h3><div class=\"line\"><span>MT5 / Eplanet</span><b>قطع</b></div><div class=\"line\"><span>داده زنده</span><b>موجود نیست</b></div><div class=\"line\"><span>موتورهای هوشمند</span><b>غیرفعال</b></div><div class=\"line\"><span>اجرای خودکار</span><b>غیرفعال</b></div></div></div>","<div class=\"card\"><h3>محیط تحلیل XAUUSD</h3><div class=\"toolbar\"><label>نماد<select><option>XAUUSD</option><option>EURUSD</option><option>BTCUSD</option></select></label><label>تایم‌فریم<select><option>M15</option><option>M1</option><option>M3</option><option>M5</option><option>H1</option><option>H4</option><option>D1</option></select></label></div><div class=\"chartbox tall\">نمودار خالی است؛ داده واقعی بارگذاری نشده است.<br>کندل یا قیمت ساختگی نمایش داده نمی‌شود.</div></div><div class=\"card\"><h3>ابزار تحلیل</h3><div class=\"line\"><span>MA 21 / 100 / 200</span><b>آماده طراحی؛ محاسبه غیرفعال</b></div><div class=\"line\"><span>RSI / ADX / Supertrend</span><b>آماده طراحی؛ محاسبه غیرفعال</b></div><div class=\"line\"><span>حمایت و مقاومت</span><b>بدون داده</b></div><div class=\"line\"><span>سیگنال موتور</span><b>نامشخص</b></div></div>","<div class=\"card\"><h3>فرم سفارش — حالت تمرینی</h3><div class=\"fields\"><label>جهت<select id=\"side\"><option>BUY</option><option>SELL</option></select></label><label>حجم (لات)<input id=\"lot\" type=\"number\" min=\".01\" step=\".01\" value=\".01\"></label><label>حد ضرر (قیمت)<input id=\"sl\" type=\"number\" step=\".01\" placeholder=\"SL\"></label><label>حد سود (قیمت)<input id=\"tp\" type=\"number\" step=\".01\" placeholder=\"TP\"></label></div><button onclick=\"simulate()\">ثبت سناریوی نمایشی</button><p id=\"tradeMessage\" class=\"muted\">هیچ سفارشی به بازار ارسال نمی‌شود.</p></div><div class=\"card\"><h3>معاملات باز واقعی</h3><div class=\"line\"><span>وضعیت</span><b>اتصال MT5 وجود ندارد</b></div><div class=\"line\"><span>معاملات دریافتی</span><b>هیچ داده‌ای دریافت نشده</b></div><div class=\"line\"><span>بستن معامله</span><b>غیرفعال</b></div></div>","<div class=\"card\"><h3>حفاظت سرمایه</h3><label>سقف توقف روزانه (دلار)<input id=\"daily\" type=\"number\" min=\"1\" value=\"50\"></label><label>حجم پایه (لات)<input id=\"baseLot\" type=\"number\" min=\".01\" step=\".01\" value=\".01\"></label><button onclick=\"saveRisk()\">ذخیره تنظیمات نمایشی</button><p id=\"riskMessage\" class=\"muted\"></p></div><div class=\"card\"><h3>کنترل نوسان شدید</h3><div class=\"line\"><span>تشخیص کندل پرشتاب</span><b>پیاده‌سازی نشده</b></div><div class=\"line\"><span>Trailing Stop</span><b>پیاده‌سازی نشده</b></div><div class=\"line\"><span>قفل معامله در شوک</span><b>پیاده‌سازی نشده</b></div><div class=\"line\"><span>توقف اضطراری واقعی</span><b>متصل نیست</b></div></div>","<div class=\"card\"><h3>آزمایشگاه استراتژی</h3><div class=\"line\"><span>داده تاریخی</span><b>متصل نیست</b></div><div class=\"line\"><span>موتور بک‌تست</span><b>اجرا نشده</b></div><div class=\"line\"><span>هزینه اسپرد و کمیسیون</span><b>محاسبه نشده</b></div><div class=\"line\"><span>افت سرمایه داخل کندل</span><b>محاسبه نشده</b></div></div><div class=\"card\"><h3>نتایج آزمون</h3><p>هیچ نتیجه آزمون تازه‌ای در این کابین تولید نشده است. برای مقایسه موتورهای قبلی باید خروجی معتبر آنها وارد شود.</p></div>","<div class=\"card\"><h3>پرتفوی</h3><div class=\"line\"><span>سرمایه مبنا</span><b>۱٬۰۰۰ دلار (نمونه)</b></div><div class=\"line\"><span>موجودی واقعی</span><b>نامشخص</b></div><div class=\"line\"><span>سود خالص</span><b>نامشخص</b></div><div class=\"line\"><span>افت سرمایه</span><b>نامشخص</b></div></div><div class=\"card\"><h3>گزارش عملکرد</h3><p>با اتصال مجاز به حساب دمو، تاریخچه واقعی در این بخش نمایش داده خواهد شد.</p></div>","<div class=\"card\"><h3>رویدادهای اقتصادی</h3><div class=\"line\"><span>داده خبری</span><b>آفلاین</b></div><div class=\"line\"><span>تقویم زنده</span><b>متصل نیست</b></div><div class=\"line\"><span>هشدار اثر بر طلا</span><b>غیرفعال</b></div></div><div class=\"card\"><h3>تحلیل رویداد</h3><p>این صفحه بدون اتصال به منبع معتبر، زمان یا اهمیت رویدادها را حدس نمی‌زند.</p></div>","<div class=\"card\"><h3>وضعیت دستگاه‌ها</h3><div class=\"line\"><span>ویندوز</span><b>فایل HTML محلی</b></div><div class=\"line\"><span>اندروید</span><b>نمای واکنش‌گرا در مرورگر</b></div><div class=\"line\"><span>همگام‌سازی</span><b>فعال نیست</b></div><div class=\"line\"><span>MT5</span><b>متصل نیست</b></div></div><div class=\"card\"><h3>امنیت</h3><p>این پیش‌نمایش به رمز حساب یا اطلاعات بروکر نیاز ندارد. هیچ معامله‌ای انجام نمی‌دهد.</p></div>","<div class=\"card\"><h3>یادداشت اصلاحات</h3><textarea id=\"notes\" rows=\"6\" placeholder=\"تغییرات موردنظر\"></textarea><button onclick=\"saveNotes()\">ذخیره یادداشت در همین مرورگر</button><p id=\"notesMessage\" class=\"muted\"></p></div><div class=\"card\"><h3>درباره نسخه</h3><div class=\"line\"><span>نوع</span><b>پیش‌نمایش آفلاین</b></div><div class=\"line\"><span>معامله واقعی</span><b>غیرفعال</b></div><div class=\"line\"><span>ذخیره‌سازی</span><b>فقط در مرورگر فعلی</b></div></div>"],names=["داشبورد","نمودار و تحلیل","معاملات و سفارش‌ها","مدیریت ریسک","آزمایشگاه و بک‌تست","سرمایه و پرتفوی","تقویم اقتصادی","ویندوز و موبایل","تنظیمات"];function go(i){document.getElementById('heading').textContent=names[i];document.getElementById('view').innerHTML='<div class="'+(i===0?'':'screen')+'">'+panels[i]+'</div>';document.querySelectorAll('.tab').forEach((e,j)=>e.classList.toggle('active',i===j));if(i===3){document.getElementById('daily').value=localStorage.getItem('farazDaily')||50;document.getElementById('baseLot').value=localStorage.getItem('farazLot')||.01}if(i===8)document.getElementById('notes').value=localStorage.getItem('farazNotes')||'';if(i===0)document.getElementById('dashstop').textContent=(localStorage.getItem('farazDaily')||50)+' $'}function simulate(){document.getElementById('tradeMessage').textContent='سناریوی '+document.getElementById('side').value+' با حجم '+document.getElementById('lot').value+' لات فقط در فرم بررسی شد؛ هیچ سفارش واقعی یا دمو ثبت نشد.'}function saveRisk(){const a=Number(document.getElementById('daily').value),b=Number(document.getElementById('baseLot').value);if(!(a>0&&b>=.01)){document.getElementById('riskMessage').textContent='مقادیر معتبر وارد کنید';return}localStorage.setItem('farazDaily',a);localStorage.setItem('farazLot',b);document.getElementById('riskMessage').textContent='تنظیمات فقط در این مرورگر ذخیره شد؛ حفاظت معاملاتی فعال نیست.'}function saveNotes(){localStorage.setItem('farazNotes',document.getElementById('notes').value);document.getElementById('notesMessage').textContent='یادداشت در این مرورگر ذخیره شد.'}go(0)</script></body></html>
