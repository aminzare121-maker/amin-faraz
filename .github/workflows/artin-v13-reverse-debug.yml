name: Artin V13 reverse debug of failed verifier
on:
  push:
    branches: [tools-makhzan-hub]
    paths: ['.github/workflows/artin-v13-reverse-debug.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  trace-previous-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find actual failed verification job across all API pages
        shell: bash
        run: |
          mkdir -p diagnostics
          gh api --paginate 'repos/${{ github.repository }}/actions/runs/42580188236/jobs?per_page=100' --jq '.jobs[] | [.id,.conclusion,.name] | @tsv' > diagnostics/jobs.tsv
          cat diagnostics/jobs.tsv
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          jobs=[line.split('\t',2) for line in Path('diagnostics/jobs.tsv').read_text().splitlines()]
          matches=[(jid,name) for jid,result,name in jobs if result=='failure' or 'independent-all-evidence-verification' in name]
          if not matches:raise RuntimeError('No verifier job found in full paginated jobs list')
          for jid,name in matches:
              dest=Path('diagnostics')/f'job-{jid}.log'
              import urllib.request,os
              req=urllib.request.Request(f'https://api.github.com/repos/${{ github.repository }}/actions/jobs/{jid}/logs',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'artin-reverse-debug'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as response:
                      dest.write_bytes(response.read())
              except Exception as exc:
                  dest.write_text('Log fetch failed: '+str(exc))
              print('TRACED_JOB',jid,name,'bytes',dest.stat().st_size,flush=True)
          PY
      - name: Publish exact failure excerpt in an issue for autonomous follow-up
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          logs=sorted(Path('diagnostics').glob('job-*.log'))
          body=['Reverse diagnosis of failed Artin run 42580188236:']
          for p in logs:
              lines=p.read_text(errors='replace').splitlines()
              errors=[line for line in lines if any(word in line.lower() for word in ('error','traceback','exception','failed','missing'))]
              body.extend([p.name,'```',*(errors[-35:] or lines[-15:]),'```'])
          if not logs:body.append('No verifier log downloaded; inspect the diagnostics artifact.')
          message='\\n'.join(body)[:55000]
          found=json.loads(subprocess.check_output(['gh','issue','list','--state','open','--search','in:title Artin V13 verifier root cause','--json','number'],text=True))
          args=['gh','issue','comment',str(found[0]['number']),'--body',message] if found else ['gh','issue','create','--title','Artin V13 verifier root cause - run 42580188236','--body',message]
          subprocess.run(args,check=True)
          PY
      - name: Persist real root-cause logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artin-v13-original-failed-verifier-root-cause
          path: diagnostics/**
          retention-days: 30
          if-no-files-found: warn
