name: Amin unified real AI service interface
on:
  push:
    paths:
      - 'amin-ai-support/cloudflare-unified/**'
      - '.github/workflows/amin-unified-ci.yml'
  pull_request:
    paths:
      - 'amin-ai-support/cloudflare-unified/**'
      - '.github/workflows/amin-unified-ci.yml'
permissions: {contents: read}
jobs:
  unified-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check amin-ai-support/cloudflare-unified/src/ai.mjs
          node --check amin-ai-support/cloudflare-unified/src/index.mjs
          node --test amin-ai-support/cloudflare-unified/test/ai.test.mjs
