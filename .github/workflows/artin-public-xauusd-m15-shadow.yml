name: Artin XAUUSD M15 public-source shadow data trial
on:
  workflow_dispatch:
  push:
    branches: [artin-v13-under180-development]
    paths:
      - '.github/workflows/artin-public-xauusd-m15-shadow.yml'
permissions:
  contents: read
jobs:
  historical-m15:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download public Dukascopy XAUUSD M15 BID candles for one year
        run: |
          mkdir -p shadow_data
          cd shadow_data
          npx --yes dukascopy-node -i xauusd -from 2025-11-13 -to 2026-11-13 -t m15 -f csv
      - name: Verify actual source data and produce machine-readable audit
        run: |
          python - <<'PY'
          import csv,glob,hashlib,json,os
          from datetime import datetime,timezone
          files=glob.glob('shadow_data/**/*.csv',recursive=True)
          if len(files)!=1: raise SystemExit('EXPECTED_EXACTLY_ONE_REAL_CSV:'+str(files))
          path=files[0]; raw=open(path,'rb').read()
          rows=list(csv.DictReader(raw.decode('utf-8-sig').splitlines()))
          if len(rows)<15000: raise SystemExit('INSUFFICIENT_M15_CANDLES:'+str(len(rows)))
          timestamps=[]; previous=None; gaps=0
          for row in rows:
              ts=int(row.get('timestamp') or row.get('time'))
              if ts>10**11:ts//=1000
              if ts%900:raise SystemExit('NON_M15_TIMESTAMP')
              if previous is not None:
                  if ts<=previous:raise SystemExit('NON_MONOTONIC_TIME')
                  if ts-previous>900:gaps+=1
              previous=ts;timestamps.append(ts)
              o,h,l,c=[float(row[k]) for k in ('open','high','low','close')]
              if not (0<l<=min(o,c)<=max(o,c)<=h):raise SystemExit('INVALID_OHLC')
          result={'schema':'artin_public_xauusd_m15_source_audit_v1',
                  'provider':'Dukascopy public feed; NOT Eplanet',
                  'symbol':'XAUUSD','timeframe':'M15','price_side':'BID',
                  'requested_from':'2025-11-13','requested_to_exclusive':'2026-11-13',
                  'source_sha256':hashlib.sha256(raw).hexdigest(),
                  'actual_rows':len(rows),'first_utc':datetime.fromtimestamp(timestamps[0],timezone.utc).isoformat(),
                  'last_utc':datetime.fromtimestamp(timestamps[-1],timezone.utc).isoformat(),
                  'gap_events_unclassified':gaps,
                  'teacher_rules_executed':False,'trade_backtest_executed':False,
                  'profit_or_loss':None,'mt5_demo_trades':0}
          os.makedirs('shadow_audit',exist_ok=True)
          with open('shadow_audit/audit.json','w') as f:json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))
          PY
      - name: Scan actual M15 candle geometry without inventing teacher trade rules
        run: |
          python - <<'PY'
          import csv,glob,json
          p=glob.glob('shadow_data/**/*.csv',recursive=True)[0]
          rows=list(csv.DictReader(open(p,encoding='utf-8-sig')))
          metrics={'bullish':0,'bearish':0,'flat':0,'exact_shadowless_nonflat':0,
                   'body_greater_than_both_shadows':0,'three_same_direction_contiguous':0,
                   'up_fvg_raw':0,'down_fvg_raw':0,'outside_previous_range':0}
          bars=[]
          for row in rows:
              t=int(row.get('timestamp') or row.get('time'))
              if t>10**11:t//=1000
              o,h,l,c=(float(row[k]) for k in ('open','high','low','close'))
              bars.append((t,o,h,l,c))
          for i,(t,o,h,l,c) in enumerate(bars):
              direction=(c>o)-(c<o)
              metrics['bullish' if direction>0 else 'bearish' if direction<0 else 'flat']+=1
              upper=h-max(o,c);lower=min(o,c)-l;body=abs(c-o)
              if direction and upper<1e-8 and lower<1e-8:metrics['exact_shadowless_nonflat']+=1
              if body>upper and body>lower:metrics['body_greater_than_both_shadows']+=1
              if i>0 and t-bars[i-1][0]==900:
                  prev=bars[i-1]
                  if h>prev[2] and l<prev[3]:metrics['outside_previous_range']+=1
              if i>1 and t-bars[i-1][0]==900 and bars[i-1][0]-bars[i-2][0]==900:
                  a,b=bars[i-2],bars[i-1]
                  if direction and direction==((b[4]>b[1])-(b[4]<b[1]))==((a[4]>a[1])-(a[4]<a[1])):
                      metrics['three_same_direction_contiguous']+=1
                  if l>a[2]:metrics['up_fvg_raw']+=1
                  if h<a[3]:metrics['down_fvg_raw']+=1
          result={'schema':'artin_public_xauusd_m15_geometry_shadow_v1',
                  'provider':'Dukascopy NOT Eplanet','source_rows':len(bars),
                  'raw_geometry_observations':metrics,
                  'teacher_decisions_verified':0,'executed_teacher_trades':0,
                  'net_profit':None,'model_shadow_only':True}
          with open('shadow_audit/geometry.json','w') as f:json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))
          PY
      - name: Audit all 13 Artin routes against actual public M15 data without fabricated predicates
        run: |
          python - <<'PY'
          import csv,glob,json
          from artin_13_real_m15_gap_audit import REQUIRED,COMMON,FAMILY,SHAPE_SUBSET_BY_ROUTE
          with open('shadow_audit/geometry.json') as f: geometry=json.load(f)
          with open('shadow_audit/audit.json') as f: source=json.load(f)
          counts=geometry['raw_geometry_observations']
          subset_map={'exact_shadowless_nonflat_subset':'exact_shadowless_nonflat',
                      'three_same_direction_raw_candidate':'three_same_direction_contiguous',
                      'exact_zero_body_subset':'flat'}
          result={'schema':'artin_13_route_public_m15_dependency_audit_v1',
                  'source_sha256':source['source_sha256'],
                  'market':'Dukascopy XAUUSD M15 BID (NOT Eplanet)',
                  'source_rows':source['actual_rows'],
                  'routes':[],'routes_with_all_teacher_predicates':0,
                  'teacher_trade_signals':0,'trades_executed':0,'profit':None}
          for route,required in REQUIRED.items():
              needed=list(dict.fromkeys(COMMON+FAMILY+required))
              subset=SHAPE_SUBSET_BY_ROUTE.get(route)
              result['routes'].append({'route_id':route,
                  'unverified_teacher_predicates':needed,
                  'unverified_predicate_count':len(needed),
                  'raw_geometry_subset_name':subset,
                  'raw_geometry_subset_count':counts[subset_map[subset]] if subset else None,
                  'teacher_trade_approved':False})
          if len(result['routes'])!=13:raise SystemExit('REQUIRE_13_ROUTES')
          with open('shadow_audit/route_dependencies.json','w') as f:json.dump(result,f,indent=2)
          print(json.dumps({'routes':len(result['routes']),
                            'teacher_trade_signals':result['teacher_trade_signals'],
                            'source_rows':result['source_rows'],
                            'status':'SOURCE_DATA_AUDITED_TEACHER_PREDICATES_MISSING'},indent=2))
          PY
      - name: Save actual candle audit and source CSV
        uses: actions/upload-artifact@v4
        with:
          name: artin-dukascopy-m15-one-year-source-and-audit
          path: |
            shadow_data/**/*.csv
            shadow_audit/*.json
          retention-days: 7
