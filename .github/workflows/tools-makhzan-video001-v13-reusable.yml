          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-audio-${{ matrix.index }}
          path: /tmp/video001_source_audio
      - name: Original unchanged Whisper Persian ASR
        run: python3 -m pip install --disable-pip-version-check 'faster-whisper>=1.1,<2' 'numpy>=1.24,<3'
      - name: Original speech source, per-worker SHA and timestamp verification
        working-directory: research/artin-film-engine-v3-1
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python3 -u artin_parallel_asr_worker_v5.py \
            --prepped-root /tmp/video001_source_audio \
            --out /tmp/video001_fast_asr_worker \
            --index ${{ matrix.index }} --partitions ${{ needs.source-once.outputs.asr_count }} \
            --model large-v3-turbo \
            --expected-sha256 "$(python3 -c 'import json;print(json.load(open("/tmp/video001_source_audio/fast_av_manifest.json"))["video_sha256"])')"
      - uses: actions/upload-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-asr-${{ matrix.index }}
          path: /tmp/video001_fast_asr_worker/asr_evidence/**
          retention-days: 15
          if-no-files-found: error
  source-sharded-ocr:
    needs: source-once
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        index: ${{ fromJSON(needs.source-once.outputs.ocr_matrix) }}
    env:
      DISABLE_MODEL_SOURCE_CHECK: 'True'
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bfbaa2b1bffc3346253e2605d699a8c9de367193
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-ocr-${{ matrix.index }}
          path: /tmp/video001_source_ocr
      - name: Original unchanged Persian PaddleOCR
        run: python3 -m pip install --disable-pip-version-check 'paddlepaddle==3.2.2' 'paddleocr>=3.6,<4' 'Pillow>=10,<13'
      - name: OCR all assigned original chat frames, reject source SHA mismatch
        working-directory: research/artin-film-engine-v3-1
        run: |
          python3 -u artin_persian_full_chat_ocr_v7.py \
            --visual-root /tmp/video001_source_ocr \
            --visual-index /tmp/video001_source_ocr/chat_selected_index.json \
            --partition-index ${{ matrix.index }} --partition-count ${{ needs.source-once.outputs.ocr_count }} \
            --out /tmp/video001_fast_ocr_worker
      - uses: actions/upload-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-ocr-${{ matrix.index }}
          path: /tmp/video001_fast_ocr_worker/full_chat_ocr_candidates_PRIVATE.json
          retention-days: 15
          if-no-files-found: error
  independent-all-evidence-verification:
    needs: [source-once,source-sharded-asr,source-sharded-ocr,source-board-ocr]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 982bc660722c4167fbcea64b223b8698593a4d80
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-asr-*
          merge-multiple: true
          path: /tmp/video001_all_asr
      - uses: actions/download-artifact@v4
        with:
          pattern: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-ocr-*
          merge-multiple: false
          path: /tmp/video001_all_ocr
      - uses: actions/download-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-chat-index
          path: /tmp/video001_source_chat_index
      - uses: actions/download-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-board
          path: /tmp/video001_source_board
      - uses: actions/download-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-source-summary
          path: /tmp/video001_source_summary
      - uses: actions/download-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-board-ocr-UNVERIFIED-TEXT
          path: /tmp/v13_board_ocr_original
      - name: Reverse trace every strict verifier input before merge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          roots={
            'asr_manifest':Path('/tmp/video001_all_asr/manifest_redacted.json'),
            'source_summary':Path('/tmp/video001_source_summary/safe_source_prep_summary.json'),
            'chat_index':Path('/tmp/video001_source_chat_index/chat_selected_index.json'),
            'board_index':Path('/tmp/video001_source_board/visual_timeline_v6.json'),
            'board_ocr':Path('/tmp/v13_board_ocr_original/board_ocr_candidates_PRIVATE.json'),
          }
          report={'schema':'artin_v13_preflight_reverse_trace_v1','checks':[]}
          for label,p in roots.items():
              exists=p.is_file()
              report['checks'].append({'input':label,'exists':exists,'bytes':p.stat().st_size if exists else None})
          for label,p in roots.items():
              if not p.is_file():continue
              try:
                  obj=json.loads(p.read_text(encoding='utf8'))
                  report['checks'].append({'input':label,'json_valid':True,'source_sha':obj.get('source_video_sha256',obj.get('video_sha256'))})
              except Exception as e:
                  report['checks'].append({'input':label,'json_valid':False,'error':str(e)[:300]})
          b=roots['board_index']
          if b.is_file():
              index=json.loads(b.read_text(encoding='utf8'))
              root=b.parent
              missing=[];bad=[]
              for row in index.get('rows',[]):
                  for channel in ('video_frame','board','chat'):
                      obj=row.get(channel,{})
                      p=(root/obj.get('path','')).resolve()
                      if not p.is_relative_to(root.resolve()) or not p.is_file():
                          missing.append({'frame':row.get('frame_id'),'channel':channel,'path':str(p)})
                      elif hashlib.sha256(p.read_bytes()).hexdigest()!=obj.get('sha256'):
                          bad.append({'frame':row.get('frame_id'),'channel':channel})
              report['checks'].append({'input':'board_original_pixels','rows':len(index.get('rows',[])),'missing_count':len(missing),'hash_mismatch_count':len(bad),'missing_examples':missing[:8],'hash_examples':bad[:8]})
          out=Path('/tmp/video001_reverse_trace');out.mkdir(parents=True,exist_ok=True)
          (out/'preflight.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('ARTIN_REVERSE_TRACE='+json.dumps(report,ensure_ascii=False),flush=True)
          if any(c.get('exists') is False or c.get('json_valid') is False or c.get('missing_count',0)>0 or c.get('hash_mismatch_count',0)>0 for c in report['checks']):
              raise RuntimeError('Preflight failed: inspect preserved reverse trace artifact')
          PY
      - name: Preserve reverse-trace diagnostic even when strict verification fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-reverse-trace
          path: /tmp/video001_reverse_trace/preflight.json
          retention-days: 15
          if-no-files-found: warn
      - name: Normalize downloaded OCR artifact folders for unchanged strict verifier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, hashlib
          root=Path('/tmp/video001_all_ocr')
          expected=int('${{ needs.source-once.outputs.ocr_count }}')
          prefix='v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-ocr-'
          for i in range(expected):
              source=root/f'{prefix}{i}'/'full_chat_ocr_candidates_PRIVATE.json'
              if not source.is_file():
                  raise FileNotFoundError(f'Missing original OCR worker artifact {i}: {source}')
              target=root/f'video001-fast-ocr-{i}'
              target.mkdir(exist_ok=True)
              dest=target/source.name
              if dest.exists():
                  raise ValueError(f'Unexpected preexisting normalized OCR worker {i}')
              os.link(source,dest)
              if os.stat(source).st_ino != os.stat(dest).st_ino:
                  raise ValueError(f'OCR worker {i} is not an identical hard link')
          print(f'OCR artifact paths normalized without modifying original evidence: {expected}')
          PY
      - name: Strict NO LOSS original full-film ASR, OCR, time, teacher board and Q&A evidence verification
        working-directory: research/artin-film-engine-v3-1
        run: |
          python3 -u video001_fast_verify_v1.py \
            --asr-root /tmp/video001_all_asr \
            --ocr-root /tmp/video001_all_ocr \
            --source-index /tmp/video001_source_chat_index/chat_selected_index.json \
            --board-root /tmp/video001_source_board \
            --source-summary /tmp/video001_source_summary/safe_source_prep_summary.json \
            --out /tmp/video001_full_integrity \
            --audio-workers ${{ needs.source-once.outputs.asr_count }} --ocr-workers ${{ needs.source-once.outputs.ocr_count }}
      - name: Preserve independent verifier failure evidence for reverse diagnosis
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-verifier-failure-diagnostics
          path: |
            /tmp/video001_full_integrity/**/*.json
            /tmp/video001_source_summary/*.json
            /tmp/video001_all_asr/manifest_redacted.json
          retention-days: 15
          if-no-files-found: warn
      - name: Rehydrate the COMPLETE private V12 review package from unchanged source-verified evidence
        uses: actions/download-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-temporal
          path: /tmp/video001_source_temporal
      - name: Download original screenshot pixels for permanent source links (not reconstructed text)
        uses: actions/download-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-fullres-chat
          path: /tmp/video001_source_chat_original
      - name: Checkout tested non-destructive V12 evidence rehydration helper
        uses: actions/checkout@v4
        with:
          ref: tools-makhzan-hub
          path: artin-rehydration
          persist-credentials: false
      - name: Rebuild all existing V12 private report fields without deleting unverified rule fragments
        working-directory: research/artin-film-engine-v3-1
        run: |
          python3 -u "$GITHUB_WORKSPACE/artin-rehydration/research/artin-film-engine-v3-1/video001_fast_export_v12.py" \
            --proof-path /tmp/video001_full_integrity/private_fast_verify_summary.json \
            --source-path /tmp/video001_source_summary/safe_source_prep_summary.json \
            --asr-path /tmp/video001_full_integrity/asr_verified/complete_unverified_qa_evidence.json \
            --ocr-root /tmp/video001_all_ocr \
            --chat-index /tmp/video001_source_chat_index/chat_selected_index.json \
            --board-root /tmp/video001_source_board \
            --temporal-index /tmp/video001_source_temporal/original_second_by_second_chat_index.json \
            --chat-images /tmp/video001_source_chat_original \
            --out /tmp/makhzan_fast_complete_source_private \
            --audio-workers ${{ needs.source-once.outputs.asr_count }} \
            --ocr-workers ${{ needs.source-once.outputs.ocr_count }}
      - name: Strictly connect sampled board OCR to original SHA/time-indexed board source
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil
          a=pathlib.Path('/tmp/v13_board_ocr_original/board_ocr_candidates_PRIVATE.json')
          m=json.loads(a.read_text(encoding='utf8'))
          b=json.loads(pathlib.Path('/tmp/video001_source_board/visual_timeline_v6.json').read_text(encoding='utf8'))
          if (m['schema']!='V13_BOARD_TEXT_OCR_ALL_SAMPLED_SOURCE_FRAMES_V1'
            or m['source_video_sha256']!=b['source_video_sha256']
            or m['frames_processed']!=len(b['rows'])
            or m['missing_frames']!=0):
              raise ValueError('NO_BOARD_OCR_SOURCE_PROVENANCE')
          for original,candidate in zip(b['rows'],m['results']):
              if (original['frame_id']!=candidate['frame_id']
                or original['time_seconds']!=candidate['time_original_video_seconds']
                or original['board']['sha256']!=candidate['source_frame_sha256']):
                  raise ValueError('BOARD_OCR_IMAGE_HASH_OR_TIME_DIFFERS')
          out=pathlib.Path('/tmp/makhzan_fast_complete_source_private/V13_DERIVED_MACHINE_UNVERIFIED')
          out.mkdir(parents=True,exist_ok=True)
          shutil.copy2(a,out/'BOARD_OCR_CANDIDATES_UNVERIFIED.json')
          summary=json.loads(pathlib.Path('/tmp/v13_board_ocr_original/board_ocr_safe_summary.json').read_text(encoding='utf8'))
          assert summary['frames_processed']==len(b['rows'])
          pathlib.Path('/tmp/video001_full_integrity/board_ocr_safe_summary.json').write_text(json.dumps(summary,indent=2))
          print('V13_SOURCE_HASHED_BOARD_TEXT_CANDIDATES_COMPLETE=',len(b['rows']),flush=True)
          PY
      - name: Archive exact V13 raw machine texts for Behrooz in under-60-second target stage
        run: |
          python3 -u "$GITHUB_WORKSPACE/artin-rehydration/research/artin-film-engine-v3-1/video001_v13_text_archive_ready.py" \
            --source-summary /tmp/video001_source_summary/safe_source_prep_summary.json \
            --source-proof /tmp/video001_full_integrity/private_fast_verify_summary.json \
            --asr-root /tmp/video001_all_asr \
            --ocr-root /tmp/video001_all_ocr \
            --board-ocr-root /tmp/v13_board_ocr_original \
            --export-root /tmp/makhzan_fast_complete_source_private \
            --out /tmp/v13_behr_text/V13_BEHROOZ_TEXT_ONLY.zip \
            --magazine-id ${{ inputs.magazine_id }} \
            --queue-id ${{ inputs.queue_id }}
      - name: Preserve V13 machine text only, with SHA, pending private ChatGPT Library transfer
        uses: actions/upload-artifact@v4
        with:
          name: v13-behrooz-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-TEXT-ONLY
          path: /tmp/v13_behr_text/**
          retention-days: 15
          if-no-files-found: error
      - name: Archive FULL private V12 review data and original images, not only a metrics summary
        uses: actions/upload-artifact@v4
        with:
          name: makhzan-VIDEO-001-V13-CANDIDATE-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-complete-source-PRIVATE
          retention-days: 30
          if-no-files-found: error
          path: /tmp/makhzan_fast_complete_source_private/**
      - uses: actions/upload-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-final-original-source-proof
          path: /tmp/video001_full_integrity/private_fast_verify_summary.json
          retention-days: 15
          if-no-files-found: error

  record-verified-result:
    needs: [source-once,source-sharded-asr,source-sharded-ocr,source-board-ocr,independent-all-evidence-verification]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tools-makhzan-hub
          persist-credentials: false
      - name: Get final original-source proof only when ALL 17 ASR + 16 OCR and V12 export succeeded
        if: ${{ needs.independent-all-evidence-verification.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-final-original-source-proof
          path: /tmp/video001_receipt/proof
      - name: Get original SHA-verified film summary for independent cross-check
        if: ${{ needs.independent-all-evidence-verification.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-source-summary
          path: /tmp/video001_receipt/source
      - name: Get source-hashed board OCR coverage for final queue receipt
        if: ${{ needs.independent-all-evidence-verification.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-board-ocr-UNVERIFIED-TEXT
          path: /tmp/video001_receipt/board
      - name: Register proven Artin lesson in its own course registry only
        if: ${{ needs.independent-all-evidence-verification.result == 'success' && inputs.magazine_id == 'artin-course-001' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO001_MAGAZINE_ID: ${{ inputs.magazine_id }}
          VIDEO001_QUEUE_ID: ${{ inputs.queue_id }}
          VIDEO001_SOURCE_PAGE: ${{ inputs.source_page }}
          VIDEO001_SOURCE_PROOF: /tmp/video001_receipt/proof/private_fast_verify_summary.json
          VIDEO001_SOURCE_SUMMARY: /tmp/video001_receipt/source/safe_source_prep_summary.json
        run: |
          python3 -u tools-makhzan/video_queue/register_course.py
      - name: Persist one immutable result per authorized queue ID (never invent teacher meanings)
        id: receipt
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO001_MAGAZINE_ID: ${{ inputs.magazine_id }}
          VIDEO001_QUEUE_ID: ${{ inputs.queue_id }}
          VIDEO001_SOURCE_PAGE: ${{ inputs.source_page }}
          VIDEO001_EVIDENCE_DIR: /tmp/video001_receipt
          VIDEO001_SOURCE_RESULT: ${{ needs.source-once.result }}
          VIDEO001_ASR_RESULT: ${{ needs.source-sharded-asr.result }}
          VIDEO001_OCR_RESULT: ${{ needs.source-sharded-ocr.result }}
          VIDEO001_BOARD_RESULT: ${{ needs.source-board-ocr.result }}
          VIDEO001_VERIFY_RESULT: ${{ needs.independent-all-evidence-verification.result }}
        run: |
          python3 -u tools-makhzan/video_queue/write_receipt.py
      - name: Continue serial magazine only after persisted verified receipt or bounded failed retry
        if: ${{ always() && steps.receipt.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO001_MAGAZINE_ID: ${{ inputs.magazine_id }}
          VIDEO001_QUEUE_ID: ${{ inputs.queue_id }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from urllib.request import Request,urlopen
          from urllib.parse import quote
          repo=os.environ['GITHUB_REPOSITORY']
          path=f"tools-makhzan/video_queue/magazines/{os.environ['VIDEO001_MAGAZINE_ID']}/receipts/{os.environ['VIDEO001_QUEUE_ID']}.json"
          url=f"https://api.github.com/repos/{repo}/contents/{quote(path,safe='/')}?ref=tools-makhzan-hub"
          req=Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          import base64
          with urlopen(req,timeout=30) as response: obj=json.load(response)
          receipt=json.loads(base64.b64decode(obj['content']))
          status=receipt['status'];attempts=receipt.get('failure_attempts',1)
          run=int(os.environ['GITHUB_RUN_ID'])
          if receipt.get('github_run_id')!=run:
              raise ValueError('Receipt is not from this workflow run: refusing duplicate dispatch')
          should_dispatch=(status=='COMPLETE_SOURCE_VERIFIED_SEMANTIC_REVIEW_REQUIRED'
                           or (status=='FAILED_NEEDS_REVIEW' and type(attempts) is int and attempts<3))
          print('ARTIN_SERIAL_NEXT_DISPATCH='+json.dumps({'status':status,'failure_attempts':attempts,'dispatch':should_dispatch}),flush=True)
          if should_dispatch:
              subprocess.run(['gh','workflow','run','artin-v13-autopilot.yml','--ref','tools-makhzan-hub'],check=True)
          PY
