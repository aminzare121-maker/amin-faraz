  source-board-ocr:
    needs: source-once
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 27e184447480925cd814e0b604bf2924b9c460b7
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-board
          path: /tmp/v13_board_original
      - name: Install Persian and English board text recognition
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq -y install tesseract-ocr tesseract-ocr-fas tesseract-ocr-eng
      - name: OCR every sampled board frame WITHOUT claiming chart-action understanding
        working-directory: research/artin-film-engine-v3-1
        run: |
          python3 -u video001_v13_board_text_worker.py --board-root /tmp/v13_board_original --out /tmp/v13_board_ocr_new --workers 6
