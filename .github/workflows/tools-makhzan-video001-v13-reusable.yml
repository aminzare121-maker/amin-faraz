  source-sharded-asr:
    needs: source-once
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix:
        index: ${{ fromJSON(needs.source-once.outputs.asr_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bfbaa2b1bffc3346253e2605d699a8c9de367193
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-audio-${{ matrix.index }}
          path: /tmp/video001_source_audio
      - name: Original unchanged Whisper Persian ASR
        run: python3 -m pip install --disable-pip-version-check 'faster-whisper>=1.1,<2' 'numpy>=1.24,<3'
      - name: Original speech source, per-worker SHA and timestamp verification
        working-directory: research/artin-film-engine-v3-1
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python3 -u artin_parallel_asr_worker_v5.py \
            --prepped-root /tmp/video001_source_audio \
            --out /tmp/video001_fast_asr_worker \
            --index ${{ matrix.index }} --partitions ${{ needs.source-once.outputs.asr_count }} \
            --model large-v3-turbo \
            --expected-sha256 "$(python3 -c 'import json;print(json.load(open("/tmp/video001_source_audio/fast_av_manifest.json"))["video_sha256"])')"
      - uses: actions/upload-artifact@v4
