# V13 queue adaptation: active verified one-pass source preparation, unchanged independent ASR/OCR and strict integrity; no raw archive overwrite.
# Optional 4-model research adapters are NOT executed by this workflow; no semantic accuracy claim.
name: VIDEO-001 V13 candidate reusable 17 ASR + 16 OCR queue worker
on:
  workflow_call:
    inputs:
      magazine_id:
        description: Exactly one registered user-named magazine; no cross-project linkage
        required: true
        type: string
      queue_id:
        description: User-requested sequential queue item (no arbitrary override)
        required: true
        type: string
      source_page:
        description: Exact user-supplied Uupload share URL
        required: true
        type: string
      expected_sha256:
        description: Optional SHA-256 verified if one was already known
        required: false
        type: string
        default: ''
permissions:
  contents: write
  actions: write
jobs:
  source-once:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      asr_count: ${{ steps.prep_meta.outputs.asr_count }}
      ocr_count: ${{ steps.prep_meta.outputs.ocr_count }}
      asr_matrix: ${{ steps.prep_meta.outputs.asr_matrix }}
      ocr_matrix: ${{ steps.prep_meta.outputs.ocr_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned experimental V13 source engine; fixes 18 original chunks with 17 workers
        uses: actions/checkout@v4
        with:
          ref: 27e184447480925cd814e0b604bf2924b9c460b7
          path: artin-code
          persist-credentials: false
      - name: Validate original user-submitted queue item and create exact source request
        env:
          VIDEO001_INPUT_URL: ${{ inputs.source_page }}
          VIDEO001_INPUT_SHA: ${{ inputs.expected_sha256 }}
          VIDEO001_INPUT_ID: ${{ inputs.queue_id }}
          VIDEO001_INPUT_MAGAZINE: ${{ inputs.magazine_id }}
        run: |
          python3 - <<'PY'
          import os,json,re
          from pathlib import Path
          from urllib.parse import urlsplit
          page=os.environ['VIDEO001_INPUT_URL']
          p=urlsplit(page)
          if p.scheme!='https' or p.hostname!='my.uupload.ir' or not re.fullmatch(r'/p/[A-Za-z0-9_-]{3,80}/?',p.path) or p.username or p.password or p.query or p.fragment:
              raise ValueError('Only originally user-provided Uupload film share URLs')
          magazine_id=os.environ['VIDEO001_INPUT_MAGAZINE']
          if not re.fullmatch(r'[a-z][a-z0-9-]{2,50}',magazine_id):
              raise ValueError('Invalid independent magazine ID')
          queue_id=os.environ['VIDEO001_INPUT_ID']
          if not re.fullmatch(r'video-q-[0-9]{4}-[a-z0-9-]{4,64}',queue_id):
              raise ValueError('Invalid queue item identity')
          sha=os.environ.get('VIDEO001_INPUT_SHA') or None
          if sha is not None and not re.fullmatch(r'[a-f0-9]{64}',sha):
              raise ValueError('Untrusted expected video SHA')
          job={'schema':'video001_fast_source_request_v1',
               'source_page':page,'expected_sha256':sha,
               'audio_workers':17,'ocr_workers':16,'sample_seconds':30,
               'mode':'USER_AUTHORIZED_SERIAL_QUEUE_FAST_NO_TRADES'}
          Path('/tmp/makhzan_fast_user_source.json').write_text(json.dumps(job),encoding='utf8')
          print('VIDEO001_QUEUE_TYPED_SOURCE_VALIDATED='+queue_id,flush=True)
          PY
      - name: Install original movie tools without changing ASR or OCR
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Download original user MP4 ONCE and preserve ALL original audio + image evidence
        working-directory: artin-code/research/artin-film-engine-v3-1
        run: |
          python3 -u video001_v13_remote_prep.py --request /tmp/makhzan_fast_user_source.json --out /tmp/video001_fast
      - name: Determine actual source chunks and screenshot worker sets
        id: prep_meta
        run: |
          python3 - <<'PY'
          import json,os
          p='/tmp/video001_fast/prepared/safe_source_prep_summary.json'
          m=json.load(open(p))
          a=m['source_audio_worker_count'];o=m['original_ocr_workers']
          assert 1<=a<=17 and 1<=o<=16 and m['source_integrity_verified']
          outputs={'asr_count':a,'ocr_count':o,'asr_matrix':list(range(a)),'ocr_matrix':list(range(o))}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in outputs.items():f.write(k+'='+json.dumps(v,separators=(',',':'))+'\n')
          print('VIDEO001_FAST_SOURCE_WORKER_COUNT='+json.dumps({'audio':a,'ocr':o}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-board
          path: /tmp/video001_fast/prepared/board_review/**
          retention-days: 15
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-chat-index
          path: /tmp/video001_fast/prepared/full_chat/chat_selected_index.json
          retention-days: 15
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-source-summary
          path: /tmp/video001_fast/prepared/safe_source_prep_summary.json
          retention-days: 15
          if-no-files-found: error
      - name: Preserve all time-indexed one-second source scans privately
        uses: actions/upload-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-temporal
          path: /tmp/video001_fast/prepared/original_second_by_second_chat_index.json
          retention-days: 15
          if-no-files-found: error
      - name: Preserve every original high-resolution selected classroom chat image
        uses: actions/upload-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-fullres-chat
          path: /tmp/video001_fast/prepared/full_chat/
          retention-days: 15
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ contains(fromJSON(steps.prep_meta.outputs.asr_matrix), 0) }}
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-audio-0
