          path: /tmp/video001_fast_ocr_worker/full_chat_ocr_candidates_PRIVATE.json
          retention-days: 15
          if-no-files-found: error
  independent-all-evidence-verification:
    needs: [source-once,source-sharded-asr,source-sharded-ocr]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
