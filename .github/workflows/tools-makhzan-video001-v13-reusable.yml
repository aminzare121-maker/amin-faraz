          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-asr-${{ matrix.index }}
          path: /tmp/video001_fast_asr_worker/asr_evidence/**
          retention-days: 15
          if-no-files-found: error
  source-sharded-ocr:
    needs: source-once
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        index: ${{ fromJSON(needs.source-once.outputs.ocr_matrix) }}
    env:
      DISABLE_MODEL_SOURCE_CHECK: 'True'
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bfbaa2b1bffc3346253e2605d699a8c9de367193
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v13-video001-${{ inputs.magazine_id }}-${{ inputs.queue_id }}-original-ocr-${{ matrix.index }}
          path: /tmp/video001_source_ocr
      - name: Original unchanged Persian PaddleOCR
        run: python3 -m pip install --disable-pip-version-check 'paddlepaddle==3.2.2' 'paddleocr>=3.6,<4' 'Pillow>=10,<13'
      - name: OCR all assigned original chat frames, reject source SHA mismatch
        working-directory: research/artin-film-engine-v3-1
        run: |
          python3 -u artin_persian_full_chat_ocr_v7.py \
            --visual-root /tmp/video001_source_ocr \
            --visual-index /tmp/video001_source_ocr/chat_selected_index.json \
            --partition-index ${{ matrix.index }} --partition-count ${{ needs.source-once.outputs.ocr_count }} \
            --out /tmp/video001_fast_ocr_worker
      - uses: actions/upload-artifact@v4
