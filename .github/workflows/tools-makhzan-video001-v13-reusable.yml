  source-sharded-asr:
    needs: source-once
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix:
        index: ${{ fromJSON(needs.source-once.outputs.asr_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bfbaa2b1bffc3346253e2605d699a8c9de367193
          persist-credentials: false
      - uses: actions/download-artifact@v4
