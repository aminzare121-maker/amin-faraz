name: Artin evidence guard (isolated tests)
on:
  push:
    branches:
      - review/artin-evidence-integrity-chatgpt-20261107
      - review/artin-teacher-trace-gate-20261107
    paths:
      - research/artin-independent-engine/paper_m15_shadow.py
      - research/artin-independent-engine/test_paper_m15_shadow.py
      - research/artin-independent-engine/demo_shadow_synthetic.py
      - research/artin-independent-engine/teacher_evidence_gate.py
      - research/artin-independent-engine/test_teacher_evidence_gate.py
      - research/artin-independent-engine/test_entry_review.py
      - .github/workflows/artin-evidence-guard-20261107.yml
  pull_request:
    branches:
      - review/artin-m15-shadow-20261107
      - review/artin-evidence-integrity-chatgpt-20261107
    paths:
      - research/artin-independent-engine/paper_m15_shadow.py
      - research/artin-independent-engine/test_paper_m15_shadow.py
      - research/artin-independent-engine/demo_shadow_synthetic.py
      - research/artin-independent-engine/teacher_evidence_gate.py
      - research/artin-independent-engine/test_teacher_evidence_gate.py
      - research/artin-independent-engine/test_entry_review.py
      - .github/workflows/artin-evidence-guard-20261107.yml

permissions:
  contents: read

jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch without credentials retained
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run only synthetic paper-shadow tests (no broker or media)
        working-directory: research/artin-independent-engine
        run: |
          python3 -B -m unittest -v test_paper_m15_shadow test_teacher_evidence_gate test_entry_review
          python3 -B demo_shadow_synthetic.py
