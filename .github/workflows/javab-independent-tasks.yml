name: Javab - independent task directives

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

# Each report gets its own runner group: distinct tasks never share a concurrency lock.
# GitHub's available runner capacity and rate limits may still introduce queueing.
concurrency:
  group: javab-issue-${{ github.event.issue.number }}-comment-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  javab-directive:
    if: >-
      github.repository == 'aminzare121-maker/amin-faraz' &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.issue.title, 'برنامه جواب | ') &&
      github.event.issue.user.login == 'aminzare121-maker' &&
      github.event.comment.user.login == 'aminzare121-maker' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'JAVAB_REPORT_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch trusted controller from main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate scoped instruction
        id: generate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 amin-ai-support/control/javab.py \
            --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/javab-directive.txt"
      - name: Reply to the same task (not another issue)
        if: steps.generate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TASK_ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$TASK_ISSUE" --repo "$GH_REPO" \
            --body-file "$RUNNER_TEMP/javab-directive.txt"
      - name: Explain rejected report in the same issue (never as a directive)
        if: steps.generate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TASK_ISSUE: ${{ github.event.issue.number }}
        run: |
          if test -s "$RUNNER_TEMP/javab-directive.txt" &&
             grep -qx 'JAVAB_REJECTED_V1' <(head -n 1 "$RUNNER_TEMP/javab-directive.txt"); then
            gh issue comment "$TASK_ISSUE" --repo "$GH_REPO" \
              --body-file "$RUNNER_TEMP/javab-directive.txt"
          else
            echo "Unexpected failure: no safe diagnostic produced."
          fi
      - name: Keep invalid reports marked as failed
        if: steps.generate.outcome == 'failure'
        run: exit 1
