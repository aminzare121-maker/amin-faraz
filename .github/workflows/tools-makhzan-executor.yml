name: Makhzan Tool Executor - GitHub operational hub
on:
  push:
    branches:
      - tools-makhzan-hub
    paths:
      - 'tools-makhzan/requests/current.json'
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: makhzan-video-001
  cancel-in-progress: false
jobs:
  validate-request:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      action: ${{ steps.request.outputs.action }}
      job_id: ${{ steps.request.outputs.job_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: request
        name: Validate executable request against canonical private tool registry
        shell: bash
        run: |
          python3 -B tools-makhzan/validate_registry.py
          python3 -B tools-makhzan/executor.py --validate --github-output "$GITHUB_OUTPUT"
  status:
    needs: validate-request
    if: ${{ needs.validate-request.outputs.action == 'status' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute live tool status against connected PRIVATE GitHub evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B tools-makhzan/executor.py --execute-status --out /tmp/makhzan_video_status
      - name: Retain real execution report in the private hub
        uses: actions/upload-artifact@v4
        with:
          name: makhzan-VIDEO-001-executable-status
          retention-days: 30
          path: /tmp/makhzan_video_status/status.json
  complete_session:
    needs: validate-request
    if: ${{ needs.validate-request.outputs.action == 'complete_session' }}
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      DISABLE_MODEL_SOURCE_CHECK: 'True'
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout approved independent full-source transcription and vision engine
        uses: actions/checkout@v4
        with:
          ref: review/artin-fidelity-audit-v7-20261107
          path: artin-code
          persist-credentials: false
      - name: Install real Persian ASR plus source image OCR dependencies
        run: |
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python3 -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'faster-whisper>=1.1,<2' 'paddlepaddle==3.2.2' 'paddleocr>=3.6,<4' 'Pillow>=10,<13'
      - name: Validate real user source and create private full-session input
        run: python3 -B tools-makhzan/executor.py --emit-job --out /tmp/makhzan_full_session_input
      - id: source-resume-key
        name: Determine stable cryptographic key for safe ASR reuse
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          from pathlib import Path
          job=json.loads(Path("/tmp/makhzan_full_session_input/ingest_request.json").read_text(encoding="utf8"))
          sha=job.get("expected_sha256")
          if isinstance(sha,str) and re.fullmatch("[a-f0-9]{64}",sha):
              print("key="+sha[:20])
          else:
              print("key=none")
          PY
      - name: Restore completed ASR parts from a previous private runner if available
        if: ${{ steps.source-resume-key.outputs.key != 'none' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_KEY: ${{ steps.source-resume-key.outputs.key }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,subprocess,json,io,zipfile,re
          from pathlib import Path
          key=os.environ['RESUME_KEY']
          root=Path('/tmp/makhzan_complete_session_private/complete_source_private/private_asr')
          url=f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts?per_page=100"
          listing=json.loads(subprocess.check_output(['gh','api',url],text=True))
          prefix=f"makhzan-ASR-source-{key}-"
          matches=[a for a in listing.get('artifacts',[]) if
                   isinstance(a,dict) and str(a.get('name','')).startswith(prefix)
                   and not a.get('expired',True)]
          if not matches:
              print('MAKHZAN_ASR_CHECKPOINT_RESTORE=NONE')
          else:
              latest=max(matches,key=lambda a:a.get('created_at',''))
              binary=subprocess.check_output(['gh','api',f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{latest['id']}/zip"])
              count=0
              with zipfile.ZipFile(io.BytesIO(binary)) as archive:
                  for member in archive.namelist():
                      if re.fullmatch(r'chunk_[0-9]{4}_UNVERIFIED[.]json',member):
                          root.mkdir(parents=True,exist_ok=True)
                          (root/member).write_bytes(archive.read(member))
                          count+=1
              print('MAKHZAN_ASR_CHECKPOINT_RESTORED_PARTS='+str(count))
          PY
      - name: Process ALL original audio parts and classroom images; never silently stop after download
        run: |
          python3 -u artin-code/research/artin-film-engine-v3-1/artin_remote_complete_v10.py \
            --request /tmp/makhzan_full_session_input/ingest_request.json \
            --out /tmp/makhzan_complete_session_private
      - name: Retain source-hashed completed ASR chunks even if downstream processing fails
        if: ${{ always() && steps.source-resume-key.outputs.key != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: makhzan-ASR-source-${{ steps.source-resume-key.outputs.key }}-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: /tmp/makhzan_complete_session_private/complete_source_private/private_asr/chunk_*_UNVERIFIED.json
      - name: Enforce full pipeline actually ran (ASR, real images, Persian OCR, QA and rule audit)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/makhzan_complete_session_private/complete_source_private')
          x=json.loads((p/'safe_session_result.json').read_text(encoding='utf8'))
          assert x['global_audio_chunks_total']==x['global_audio_chunks_asr_completed']>0
          assert x['original_source_chat_screenshots']==x['source_screenshots_ocr_completed']>0
          assert x['source_screenshots_ocr_errors']==0
          assert x['all_source_coverage_stages_ran'] is True
          for path in ('private_original_asr_review.json','private_visual_timeline.json',
              'private_question_audio_REVIEW_ONLY.json','private_unverified_rule_context.json'):
              assert (p/path).is_file(), path
          assert x['source_verified_trading_rules']==0
          assert not x['demo_trades_allowed'] and not x['real_trades_allowed']
          print('MAKHZAN_COMPLETE_SESSION_SOURCE_PIPELINE_SUCCESS='+json.dumps({
             'audio_parts':x['global_audio_chunks_asr_completed'],
             'chat_ocr_frames':x['source_screenshots_ocr_completed'],
             'q_a_review_candidates':x['provisional_question_groups'],
             'semantic_accuracy_not_yet_verified':True}))
          PY
      - name: Save PRIVATE session evidence for future human source accuracy and multi-lesson joining
        uses: actions/upload-artifact@v4
        with:
          name: makhzan-video-complete-ASR-OCR-QA-PRIVATE
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/makhzan_complete_session_private/complete_source_private/safe_session_result.json
            /tmp/makhzan_complete_session_private/complete_source_private/private_original_asr_review.json
            /tmp/makhzan_complete_session_private/complete_source_private/private_visual_timeline.json
            /tmp/makhzan_complete_session_private/complete_source_private/private_question_audio_REVIEW_ONLY.json
            /tmp/makhzan_complete_session_private/complete_source_private/private_question_clusters_REVIEW_ONLY.json
            /tmp/makhzan_complete_session_private/complete_source_private/private_unverified_rule_context.json
            /tmp/makhzan_complete_session_private/complete_source_private/private_ocr/full_chat_ocr_candidates_PRIVATE.json
            /tmp/makhzan_complete_session_private/complete_source_private/visual/board/**
            /tmp/makhzan_complete_session_private/complete_source_private/visual/chat/**

  course_status:
    needs: validate-request
    if: ${{ needs.validate-request.outputs.action == 'course_status' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute actual Artin course puzzle from the central hub
        run: |
          python3 -B tools-makhzan/executor.py --execute-course --out /tmp/makhzan_artin_course
      - name: Keep durable session summary without copying private class media
        uses: actions/upload-artifact@v4
        with:
          name: makhzan-VIDEO-001-multi-session-course-puzzle-status
          retention-days: 30
          path: /tmp/makhzan_artin_course/course_puzzle_status.json
  build_review:
    needs: validate-request
    if: ${{ needs.validate-request.outputs.action == 'build_review' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout registered tool SOURCE from pinned private working branch
        uses: actions/checkout@v4
        with:
          ref: review/artin-fidelity-audit-v7-20261107
          path: artin-code
          persist-credentials: false
      - name: Retrieve original 17-part audio AND 59 provisional question groups
        uses: actions/download-artifact@v4
        with:
          name: artin-v8-real-chat-speech-QA-REVIEW-ONLY
          repository: aminzare121-maker/amin-faraz
          run-id: 42393181420
          github-token: ${{ github.token }}
          path: /tmp/makhzan_orig/qa
      - uses: actions/download-artifact@v4
        with:
          name: artin-v7-fidelity-audit-original-lesson
          repository: aminzare121-maker/amin-faraz
          run-id: 42389814966
          github-token: ${{ github.token }}
          path: /tmp/makhzan_orig/claims
      - uses: actions/download-artifact@v4
        with:
          name: artin-v5-full-17part-review-unverified
          repository: aminzare121-maker/amin-faraz
          run-id: 42382408395
          github-token: ${{ github.token }}
          path: /tmp/makhzan_orig/audio
      - uses: actions/download-artifact@v4
        with:
          name: artin-original-visual-board-and-chat-v6
          repository: aminzare121-maker/amin-faraz
          run-id: 42383557569
          github-token: ${{ github.token }}
          path: /tmp/makhzan_orig/images
      - name: REALLY EXECUTE original teacher evidence reviewer from tool repository
        run: |
          python3 -B artin-code/research/artin-film-engine-v3-1/artin_offline_review_package_v8.py \
            --qa /tmp/makhzan_orig/qa/qa_review_PRIVATE.json \
            --claims /tmp/makhzan_orig/claims/fidelity_candidates_PRIVATE.json \
            --audio /tmp/makhzan_orig/audio/complete_unverified_qa_evidence.json \
            --visual-index /tmp/makhzan_orig/images/visual/visual_timeline_v6.json \
            --visual-root /tmp/makhzan_orig/images/visual \
            --out /tmp/makhzan_VIDEO-001_review
      - name: Verify actual 59 questions 35 rule-review packets with 192 original images
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/makhzan_VIDEO-001_review')
          s=json.loads((p/'summary_safe.json').read_text())
          assert s['question_groups']==59 and s['unverified_rule_fragments']==35
          assert s['source_images_copied']>=100
          assert s['executable_teacher_rules']==0
          assert (p/'index.html').exists()
          print('MAKHZAN_REAL_TOOL_EXECUTED='+json.dumps({
               'tool_id':'VIDEO-001','action':'build_review',
               'questions':s['question_groups'],'rule_review_packets':s['unverified_rule_fragments'],
               'original_images':s['source_images_copied'],'verified_teacher_rules':0}))
          PY
      - name: Publish assistant-executed MOBILE and WINDOWS practical tool from Makhzan hub
        uses: actions/upload-artifact@v4
        with:
          name: makhzan-VIDEO-001-actual-mobile-desktop-review-PRIVATE
          retention-days: 30
          path: /tmp/makhzan_VIDEO-001_review/**
  source_ingest:
    needs: validate-request
    if: ${{ needs.validate-request.outputs.action == 'source_ingest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: review/artin-fidelity-audit-v7-20261107
          path: artin-code
          persist-credentials: false
      - name: Install image/audio extraction dependencies for a new user-provided video
        run: |
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Convert hub request into typed video-ingestion job
        run: python3 -B tools-makhzan/executor.py --emit-job --out /tmp/makhzan_video_input
      - name: REALLY PROCESS user-supplied source, not an invented project
        run: |
          python3 -B artin-code/research/artin-film-engine-v3-1/artin_generic_video_job_v6.py \
            --request /tmp/makhzan_video_input/ingest_request.json \
            --out /tmp/makhzan_video_source_private
      - name: Keep hash-and-time validated intake result only; original media never committed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makhzan-VIDEO-001-new-video-source-evidence
          retention-days: 30
          if-no-files-found: ignore
          path: /tmp/makhzan_video_source_private/safe_result.json
