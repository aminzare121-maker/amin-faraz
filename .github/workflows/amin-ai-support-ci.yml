name: Amin AI Support Hub CI

on:
  push:
    paths:
      - "amin-ai-support/**"
      - ".github/workflows/amin-ai-support-ci.yml"
      - ".github/workflows/amin-report-directive.yml"
      - ".github/workflows/javab-independent-tasks.yml"
  pull_request:
    paths:
      - "amin-ai-support/**"
      - ".github/workflows/amin-ai-support-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Block paid GitHub runner classes in all repository workflows
        run: python amin-ai-support/audit_free_github.py
      - name: Compile source
        run: python -m py_compile amin-ai-support/amin_support.py
      - name: Install open-source WebSocket runtime for full-duplex tests
        run: python -m pip install "websockets>=14,<18"
      - name: Install free official SIWC OAuth and system-keychain dependencies
        run: python -m pip install -r amin-ai-support/requirements-siwc.txt
      - name: Compile direct ChatGPT plan adapter
        run: python -m py_compile amin-ai-support/chatgpt_plan_direct.py
      - name: Run offline tests
        working-directory: amin-ai-support
        run: python -m unittest discover -s tests -v
      - name: Test report-to-directive controller (no remote execution)
        run: python -m unittest discover -s amin-ai-support/control/tests -v
      - name: Compile controller
        run: python -m py_compile amin-ai-support/control/continuation.py
      - name: Execute JVM state-machine tests for Javab activation/stop
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/javab-jvm"
          javac -d "$RUNNER_TEMP/javab-jvm" \
            amin-ai-support/android-companion/JavabActivationState.java \
            amin-ai-support/android-companion/tests/JavabActivationStateTest.java
          java -cp "$RUNNER_TEMP/javab-jvm" \
            com.amin.javab.screen.JavabActivationStateTest
      - name: Synthetic project knowledge regression (not real-world acceptance)
        working-directory: amin-ai-support
        run: python evaluation.py --strict
      - name: Verify project configuration
        working-directory: amin-ai-support
        run: python -c "from amin_support import load_projects; print(sorted(load_projects()))"
      - name: Verify actual GitHub integration and project isolation
        working-directory: amin-ai-support
        run: |
          python amin_support.py sync --project faraz
          python amin_support.py sync --project artin
          python -c "from amin_support import SupportEngine; e=SupportEngine(); assert e.knowledge.count('faraz')>0 and e.knowledge.count('artin')>0; assert e.knowledge.count('v5')==0; print('Real branches indexed into isolated namespaces')"
