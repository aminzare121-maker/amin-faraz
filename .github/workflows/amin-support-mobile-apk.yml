name: Build Amin AI Support Mobile APK (debug)

on:
  push:
    branches:
      - main
      - feature/amin-mobile-support-client-20261122
    paths:
      - "amin-ai-support/android-client/**"
      - ".github/workflows/amin-support-mobile-apk.yml"
  pull_request:
    paths:
      - "amin-ai-support/android-client/**"
      - ".github/workflows/amin-support-mobile-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-mobile-support:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Test HTTPS and scoped token policy with JVM
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amin-mobile-jvm"
          javac -d "$RUNNER_TEMP/amin-mobile-jvm" \
            amin-ai-support/android-client/app/src/main/java/com/amin/support/mobile/SupportEndpoint.java \
            amin-ai-support/android-client/tests/MobileEndpointTest.java
          java -cp "$RUNNER_TEMP/amin-mobile-jvm" com.amin.support.mobile.MobileEndpointTest
      - name: Test PRIVATE GitHub relay policy with JVM
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/amin-mobile-jvm" \
            amin-ai-support/android-client/app/src/main/java/com/amin/support/mobile/GitHubBridgePolicy.java \
            amin-ai-support/android-client/tests/GitHubBridgePolicyTest.java
          java -cp "$RUNNER_TEMP/amin-mobile-jvm" com.amin.support.mobile.GitHubBridgePolicyTest
      - name: Test secure WSS live endpoint with JVM
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/amin-mobile-jvm" \
            amin-ai-support/android-client/app/src/main/java/com/amin/support/mobile/LiveEndpointPolicy.java \
            amin-ai-support/android-client/tests/LiveEndpointPolicyTest.java
          java -cp "$RUNNER_TEMP/amin-mobile-jvm" com.amin.support.mobile.LiveEndpointPolicyTest
      - name: Test signed APK delivery and allowed GitHub hosts with JVM
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/amin-mobile-jvm" \
            amin-ai-support/android-client/app/src/main/java/com/amin/support/mobile/DeliveryPolicy.java \
            amin-ai-support/android-client/tests/DeliveryPolicyTest.java
          java -cp "$RUNNER_TEMP/amin-mobile-jvm" com.amin.support.mobile.DeliveryPolicyTest
      - name: Test lightweight Persian online/offline speech mode on JVM
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/amin-mobile-jvm" \
            amin-ai-support/android-client/app/src/main/java/com/amin/support/mobile/VoiceModePolicy.java \
            amin-ai-support/android-client/app/src/main/java/com/amin/support/mobile/OfflineVoiceCommands.java \
            amin-ai-support/android-client/tests/VoiceModePolicyTest.java
          java -cp "$RUNNER_TEMP/amin-mobile-jvm" com.amin.support.mobile.VoiceModePolicyTest
      - name: Test original Amin Persian prosody persona on JVM
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/amin-mobile-jvm" \
            amin-ai-support/android-client/app/src/main/java/com/amin/support/mobile/AminVoicePersona.java \
            amin-ai-support/android-client/tests/AminVoicePersonaTest.java
          java -cp "$RUNNER_TEMP/amin-mobile-jvm" com.amin.support.mobile.AminVoicePersonaTest
      - name: Verify neural audio protocol and SHA-256 on JVM
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/amin-mobile-jvm" \
            amin-ai-support/android-client/app/src/main/java/com/amin/support/mobile/NeuralAudioPolicy.java \
            amin-ai-support/android-client/tests/NeuralAudioPolicyTest.java
          java -cp "$RUNNER_TEMP/amin-mobile-jvm" com.amin.support.mobile.NeuralAudioPolicyTest
      - name: Test independent checkout HTTPS, invoice and transaction validation
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/amin-mobile-jvm" \
            amin-ai-support/android-client/app/src/main/java/com/amin/support/mobile/SupportEndpoint.java \
            amin-ai-support/android-client/app/src/main/java/com/amin/support/mobile/CheckoutPolicy.java \
            amin-ai-support/android-client/tests/CheckoutPolicyTest.java
          java -cp "$RUNNER_TEMP/amin-mobile-jvm" com.amin.support.mobile.CheckoutPolicyTest
      - name: Check chat response visibility and optional voice layout
        run: python3 amin-ai-support/android-client/tests/test_mobile_screen_order.py
      - name: Test temporary project-isolated conversation memory on JVM
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/amin-mobile-jvm" \\
            amin-ai-support/android-client/app/src/main/java/com/amin/support/mobile/ConversationMemory.java \\
            amin-ai-support/android-client/tests/ConversationMemoryTest.java
          java -cp "$RUNNER_TEMP/amin-mobile-jvm" com.amin.support.mobile.ConversationMemoryTest
      - name: Build actual installable Android app
        working-directory: amin-ai-support/android-client
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Inspect mobile APK
        run: |
          set -euo pipefail
          APK="amin-ai-support/android-client/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -15
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Publish test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amin-support-mobile-debug-apk
          path: amin-ai-support/android-client/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
