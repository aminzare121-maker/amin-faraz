name: Artin session2 targeted currency unit clarification
on:
  push:
    branches: [audit/artin25-cloud-evidence-20261109]
    paths: [.github/workflows/artin25-text-selected-case2.yml]
permissions:
  contents: read
  actions: read
jobs:
  selected-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Read selected text cases and preserve only corresponding image evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p private review
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          def fetch(artifact,path):
              with open(path,'wb') as f:p=subprocess.run(['gh','api',f'repos/aminzare121-maker/amin-faraz/actions/artifacts/{artifact}/zip'],stdout=f,stderr=subprocess.PIPE,timeout=300)
              if p.returncode:raise RuntimeError('EXISTING_EVIDENCE_READ_FAILED')
          fetch(13694173934,'private/plan.zip')
          with zipfile.ZipFile('private/plan.zip') as z:plan=json.loads(z.read('targeted_review_PRIVATE.json'))
          expected='60e909d7a3acb57a5e80b689e6dac576db479c04795afc413229d7492afc7748'
          if plan['sequence']!=2 or plan['source_sha256']!=expected:raise ValueError('TEXT_PLAN_SOURCE_MISMATCH')
          fetch(13691146531,'private/source.zip')
          h=hashlib.sha256()
          with zipfile.ZipFile('private/source.zip') as z,z.open('original.mp4') as src,open('private/source.mp4','wb') as dst:
              for b in iter(lambda:src.read(4*1024*1024),b''):h.update(b);dst.write(b)
          if h.hexdigest()!=expected:raise ValueError('ORIGINAL_CHANGED')
          fetch(13595062798,'private/text.zip')
          with zipfile.ZipFile('private/text.zip') as z:
              matches=[n for n in z.namelist() if n.endswith('part_004_unverified.json')]
              if len(matches)!=1:raise ValueError('SOURCE_TRANSCRIPT_NOT_UNIQUE')
              raw=z.read(matches[0]);doc=json.loads(raw)
          if doc.get('source_video_sha256')!=expected or doc.get('timebase')!='absolute_original_video_seconds':raise ValueError('SOURCE_TRANSCRIPT_IDENTITY_FAILED')
          context=[s for s in doc['segments'] if s['end']>=1150 and s['start']<=1208]
          images=[]
          for t in [1165.0,1173.0,1184.0]:
              name=f'frame_{t:010.3f}.png';target=pathlib.Path('review')/name
              p=subprocess.run(['ffmpeg','-nostdin','-v','error','-ss',str(t),'-i','private/source.mp4','-frames:v','1',str(target)],capture_output=True,timeout=60)
              if p.returncode:raise RuntimeError('SELECTED_FRAME_READ_FAILED')
              images.append({'file':name,'original_video_seconds':t,'image_sha256':hashlib.sha256(target.read_bytes()).hexdigest()})
          pathlib.Path('review/text_selected_review_PRIVATE.json').write_text(json.dumps({'sequence':2,'source_sha256':expected,'case_id':'USDCAD_UNIT_1150_1208','selection_reason':'Existing text appears to assign a dollar value across differently quoted pairs; inspect actual symbol specifications and currency units instead of correcting from general knowledge.','transcript_artifact':13595062798,'transcript_sha256':hashlib.sha256(raw).hexdigest(),'source_audio_sha256':doc.get('source_audio_sha256'),'context':context,'images':images,'models_executed':0,'image_relations_verified':False,'semantic_verified':False},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'sequence':2,'newly_selected_images':len(images),'previous_39_images_reextracted':False,'models_executed':0,'semantic_verified':False}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: artin25-session2-USDCAD-unit-review-PRIVATE
          path: review/
          retention-days: 90
          if-no-files-found: error
