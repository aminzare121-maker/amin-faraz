name: VIDEO-001 serial queued classroom movies (user submitted only)
on:
  push:
    branches: [tools-makhzan-hub]
    paths:
      - 'tools-makhzan/video_queue/entries/*.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: video001-serial-queue-latest-pending-scan
  cancel-in-progress: false
jobs:
  collect-and-order-pending-movies:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      count: ${{ steps.queue.outputs.count }}
      items: ${{ steps.queue.outputs.items }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tools-makhzan-hub
          persist-credentials: false
          fetch-depth: 0
      - name: Read the LATEST canonical queue, not stale triggering commit
        run: |
          git fetch --no-tags origin tools-makhzan-hub
          git reset --hard origin/tools-makhzan-hub
      - name: Never overlap unverified first in-flight session 2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          repo=os.environ['GITHUB_REPOSITORY']
          # Film #2 was started from the registered hub before the serial queue existed.
          prior_id=42423414479
          for attempt in range(450):
              s=json.loads(subprocess.check_output(
                  ['gh','api',f'/repos/{repo}/actions/runs/{prior_id}'],text=True))
              if s['status']=='completed':
                  if s.get('conclusion')!='success':
                      raise RuntimeError(
                          'Film #2 incomplete/failed; do NOT advance to #3 until source evidence is repaired')
                  print('VIDEO001_PRIOR_SECOND_SOURCE_VERIFIED_SUCCESS=True')
                  break
              if attempt==449:
                  raise TimeoutError('Film #2 still running. Queue remains saved; no overlapping films.')
              time.sleep(12)
          PY
      - name: Safely enumerate all user-submitted pending movies and skip immutable receipts
        id: queue
        run: |
          python3 -u tools-makhzan/video_queue/load_queue.py --github-output "$GITHUB_OUTPUT"
  process-one-full-movie-at-a-time:
    needs: collect-and-order-pending-movies
    if: ${{ needs.collect-and-order-pending-movies.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.collect-and-order-pending-movies.outputs.items) }}
    uses: ./.github/workflows/tools-makhzan-video001-fast-reusable.yml
    with:
      queue_id: ${{ matrix.queue_id }}
      source_page: ${{ matrix.source_page }}
      expected_sha256: ${{ matrix.expected_sha256 }}
