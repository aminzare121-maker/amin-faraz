name: VIDEO-001 independent magazine serial video queue
# Explicit user-authorized single retry for Artin video-q-0003 after archived 18-chunk ASR failure.
# Resume sequential processing ONLY after independently verified full-source receipt.
on:
  workflow_dispatch:
  push:
    branches: [tools-makhzan-hub]
    paths:
      - '.github/workflows/tools-makhzan-video001-serial-queue.yml'
      - 'tools-makhzan/video_queue/magazines/*/entries/*.json'
permissions:
  contents: write
  actions: write
concurrency:
  group: video001-serial-queue-latest-pending-scan
  cancel-in-progress: false
jobs:
  collect-and-order-pending-movies:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      count: ${{ steps.queue.outputs.count }}
      items: ${{ steps.queue.outputs.items }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tools-makhzan-hub
          persist-credentials: false
      # Checkout explicitly follows the latest canonical branch at runner start.
      # Do not issue a second unauthenticated git fetch with credentials disabled.
      - name: Enumerate only exact user-named magazines from latest branch
        id: queue
        run: |
          python3 -u tools-makhzan/video_queue/load_queue.py --github-output "$GITHUB_OUTPUT"
      - name: For Artin-only, never overlap the already running film #2
        if: ${{ contains(steps.queue.outputs.items, 'artin-course-001') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          repo=os.environ['GITHUB_REPOSITORY']
          run=42423414479
          for attempt in range(440):
              s=json.loads(subprocess.check_output(
                  ['gh','api',f'/repos/{repo}/actions/runs/{run}'],text=True))
              if s['status']=='completed':
                  if s.get('conclusion')!='success':
                      raise RuntimeError('Previously submitted Artin film #2 incomplete. Do not skip to #3.')
                  print('VIDEO001_ARTIN_SESSION2_PRECEDES_MAGAZINE_NEXT=True')
                  break
              if attempt==439:
                  raise TimeoutError('Artin session #2 still incomplete; queue preserved without skipping')
              time.sleep(12)
          PY
  process-one-full-movie-at-a-time:
    needs: collect-and-order-pending-movies
    if: ${{ needs.collect-and-order-pending-movies.outputs.count != '0' }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.collect-and-order-pending-movies.outputs.items) }}
    uses: ./.github/workflows/tools-makhzan-video001-fast-reusable.yml
    with:
      magazine_id: ${{ matrix.magazine_id }}
      queue_id: ${{ matrix.queue_id }}
      source_page: ${{ matrix.source_page }}
      expected_sha256: ${{ matrix.expected_sha256 }}
