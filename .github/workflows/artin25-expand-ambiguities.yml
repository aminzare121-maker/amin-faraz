name: Artin expand documented ambiguous visual references
on:
  push:
    branches: [audit/artin25-cloud-evidence-20261109]
    paths: [.github/workflows/artin25-expand-ambiguities.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: artin25-documented-ambiguity-expansion
  cancel-in-progress: false
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sequence: [19]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Install media reader without speech models
        run: python3 -m pip install --quiet --disable-pip-version-check --target .ffmpeg-tools imageio-ffmpeg==0.6.0
      - name: Expand only documented references from hash-verified originals
        env:
          GH_TOKEN: ${{ github.token }}
          SEQUENCE: ${{ matrix.sequence }}
          PYTHONPATH: .ffmpeg-tools
        run: python3 audit/artin25-cloud/expand_ambiguous_visuals.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: artin25-expanded-ambiguity-${{ matrix.sequence }}-PRIVATE
          path: review/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
