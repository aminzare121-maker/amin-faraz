name: Artin chart viewport evidence (no trading)
on:
  push:
    branches:
      - artin-v13-under180-development
    paths:
      - 'artin_9_chart_registration_v1.py'
      - 'test_artin_9_chart_registration_public.py'
      - '.github/workflows/artin-chart-viewport-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-viewport-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned computer-vision test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Run public synthetic image-registration tests
        shell: bash
        run: python -m unittest -v test_artin_9_chart_registration_public
      - name: Run public synthetic image-registration tests with Python optimized
        shell: bash
        run: python -O -m unittest -v test_artin_9_chart_registration_public
