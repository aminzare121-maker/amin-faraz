name: Support Hub real local LLM pilot

on:
  workflow_dispatch:
  push:
    branches: [feature/support-real-llm-pilot-20261122]
    paths:
      - "amin-ai-support/real_model_smoke.py"
      - ".github/workflows/amin-real-model-pilot.yml"

permissions:
  contents: read

concurrency:
  group: amin-real-llm-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-local-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Pull Ollama runner and load a real Apache-2.0 Qwen model
        run: |
          set -euo pipefail
          docker run -d --name amin-qwen --pull=always \
            -p 127.0.0.1:11434:11434 \
            -e OLLAMA_NUM_PARALLEL=1 \
            -e OLLAMA_MAX_LOADED_MODELS=1 \
            ollama/ollama:latest
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "OLLAMA_READY"; break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          docker exec amin-qwen ollama pull qwen2.5:7b-instruct
      - name: Verify live Persian inference and project-aware answer through actual model
        env:
          AMIN_MODEL_BASE_URL: http://127.0.0.1:11434/v1
          AMIN_MODEL_NAME: qwen2.5:7b-instruct
          PYTHONUNBUFFERED: "1"
          AMIN_MODEL_PROBE_TIMEOUT_SECONDS: "90"
        working-directory: amin-ai-support
        run: |
          python model_probe.py
          python real_model_smoke.py
      - name: Stop disposable model and leave no credentials
        if: always()
        run: docker rm -f amin-qwen || true
