name: V13 isolated development acceptance checks
on:
  push:
    branches: [artin-v13-under180-development]
    paths:
      - 'tools-makhzan/v13-development/**'
      - '.github/workflows/v13-development-gates.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v13-development-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-acceptance-gate:
    if: github.ref == 'refs/heads/artin-v13-under180-development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artin-v13-under180-development
          persist-credentials: false
      - name: Compile development gate
        run: python3 -m py_compile tools-makhzan/v13-development/*.py
      - name: Unit tests for V13 evidence gate (synthetic tests only)
        run: python3 -m unittest discover -s tools-makhzan/v13-development -p 'test_*.py' -v
      - name: Explain scope
        if: always()
        run: |
          echo 'Development checks only. No real video, <180s result, autonomous code modification or production switch.' >> "$GITHUB_STEP_SUMMARY"
