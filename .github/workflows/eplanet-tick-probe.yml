name: Eplanet public Windows tick acquisition probe
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/eplanet-tick-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Eplanet MT5 terminal and Python bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.metatrader.com/cdn/web/eplanet.brokers.ltd/mt5/eplanet5setup.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'eplanet5setup.exe'
          $dest = Join-Path $env:RUNNER_TEMP 'EplanetMT5'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'MetaQuotes') { throw 'Installer publisher/signature not verified' }
          $p = Start-Process -FilePath $exe -ArgumentList @('/auto', "/path:`"$dest`"") -PassThru
          $terminal = $null
          for ($i=0; $i -lt 60; $i++) {
            if (Test-Path (Join-Path $dest 'terminal64.exe')) { $terminal = Join-Path $dest 'terminal64.exe'; break }
            $found = Get-ChildItem -Path $env:ProgramFiles -Filter terminal64.exe -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'eplanet' } | Select-Object -First 1
            if ($found) { $terminal = $found.FullName; break }
            Start-Sleep -Seconds 3
          }
          if (-not $terminal) { throw 'Official terminal not found after installer attempt' }
          "MT5_TERMINAL=$terminal" >> $env:GITHUB_ENV
          python -m pip install MetaTrader5
          if ($LASTEXITCODE -ne 0) { throw 'Python MT5 bridge installation failed' }
      - name: Read-only connection and one-day tick probe
        shell: pwsh
        run: |
          @'
          import os, json, datetime, hashlib, sys
          import MetaTrader5 as mt5
          from pathlib import Path
          report = {"symbol":"XAUUSD.st", "source":"Eplanet only", "raw_ticks_published":False, "orders_sent":0}
          def stop(reason):
              report["status"]=reason
              Path("probe.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
              print(json.dumps(report))
              sys.exit(1)
          try:
              if not mt5.initialize(os.environ["MT5_TERMINAL"], portable=True, timeout=60000):
                  report["mt5_error_code"]=mt5.last_error()[0]
                  stop("terminal_initialization_failed")
              info=mt5.account_info()
              if info is None:
                  stop("no_authorized_demo_session")
              if info.trade_mode != mt5.ACCOUNT_TRADE_MODE_DEMO or "eplanet" not in (info.server+" "+info.company).lower():
                  stop("not_verified_eplanet_demo")
              if not mt5.symbol_select("XAUUSD.st", True):
                  stop("requested_symbol_unavailable")
              start=datetime.datetime(2026,11,12,tzinfo=datetime.timezone.utc)
              end=start+datetime.timedelta(days=1)
              ticks=mt5.copy_ticks_range("XAUUSD.st",start,end-datetime.timedelta(milliseconds=1),mt5.COPY_TICKS_ALL)
              if ticks is None or len(ticks)==0:
                  report["mt5_error_code"]=mt5.last_error()[0]
                  stop("no_ticks_returned")
              report.update({"status":"sample_received_not_full_coverage", "count":len(ticks), "first_time_msc":int(ticks["time_msc"][0]),"last_time_msc":int(ticks["time_msc"][-1]),"sha256":hashlib.sha256(ticks.tobytes()).hexdigest(), "invalid_bid_ask":int(((ticks["bid"]<=0)|(ticks["ask"]<ticks["bid"])).sum())})
              Path("probe.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
              print(json.dumps(report))
          finally:
              mt5.shutdown()
          '@ | Set-Content -Encoding utf8 probe.py
          python probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve only non-sensitive diagnostic metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eplanet-tick-probe-report
          path: probe.json
          if-no-files-found: warn
          retention-days: 7
