name: ARTIN20 original fullres images lossless sharded recovery
on:
  push:
    branches:
      - audit/artin20-evidence-extraction-20261109
    paths:
      - 'research/artin20_fullres/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: artin20-fullres-recovery
  cancel-in-progress: false
jobs:
  split_original:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download 610MB original image archive and split losslessly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: aminzare121-maker/amin-faraz
        run: python3 -u research/artin20_fullres/split_original.py
      - name: Upload manifest of original source member SHA256s
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artin20-fullres-manifest
          path: artin20_fullres_recovery/fullres_split_manifest.json
          if-no-files-found: warn
          retention-days: 60
      - name: Preserve original image group 00
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artin20-fullres-original-images-00
          path: artin20_fullres_recovery/private_shards/part_00.zip
          if-no-files-found: ignore
          retention-days: 60
          compression-level: 0
      - name: Preserve original image group 01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artin20-fullres-original-images-01
          path: artin20_fullres_recovery/private_shards/part_01.zip
