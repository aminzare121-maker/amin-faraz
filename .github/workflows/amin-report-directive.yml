name: Amin Report-to-Directive Controller

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: amin-report-controller-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  respond:
    if: >-
      github.repository == 'aminzare121-maker/amin-faraz' &&
      github.event.issue.number == 68 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'aminzare121-maker' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'AMIN_REPORT_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout approved rules on main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compute next directive without executing project code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 amin-ai-support/control/continuation.py \
            --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/amin-directive.txt"
      - name: Return directive to the same GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue comment 68 --repo "$GH_REPO" \
            --body-file "$RUNNER_TEMP/amin-directive.txt"
