name: Makhzan tools registry integrity check
on:
  push:
    branches:
      - tools-makhzan-hub
    paths:
      - 'tools-makhzan/**'
      - '.github/workflows/tools-makhzan-integrity.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate persistent tool registry and truthful status
        run: python3 tools-makhzan/validate_registry.py
      - name: Verify complete-session command is not extraction-only
        run: python3 -B -m unittest discover -s tools-makhzan -p 'test_executor_complete.py'
