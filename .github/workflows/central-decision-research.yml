name: Central decision research tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/central-decision-manager/**'
      - '.github/workflows/central-decision-research.yml'
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node research/central-decision-manager/selftest.mjs
