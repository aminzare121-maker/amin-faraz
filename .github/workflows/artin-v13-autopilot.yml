name: Artin V13 autopilot - serial source and text extraction
# Authorized queue continuation 2026-11-09: resume from first unreceipted entry, keep source and trading code unchanged.
# V13 verifier diagnostic and receipt fixes: 31c14306cf52d7fe0ea51bed200ef857e9fdc9db
# Event-driven entry point: push or workflow_dispatch; no 15-minute polling.
# Resume authorized queue after verified continuation authentication repair acf0528; first missing receipt only.
# Authorized queue check 2026-11-09: receipt 0011 verified, resume first unreceipted entry 0012.
# Restart after registration-proof and V12/Behrooz fixes; process first unresolved authorized film.
# New-run recovery trigger: never rerun stale workflow snapshots; use fresh branch checkout for video 004.
# Explicitly user-submitted magazine entries only. No trading or invented rules.
on:
  push:
    branches: [tools-makhzan-hub]
    paths:
      - '.github/workflows/artin-v13-autopilot.yml'
      - '.github/workflows/tools-makhzan-video001-v13-reusable.yml'
      - 'tools-makhzan/video_queue/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: artin-v13-autopilot-single-active-video
  cancel-in-progress: false
jobs:
  find-next-authorized-video:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      count: ${{ steps.queue.outputs.count }}
      items: ${{ steps.queue.outputs.items }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tools-makhzan-hub
          persist-credentials: false
      - name: Check queue code syntax and failed-receipt retry logic before any paid media processing
        run: |
          python3 -m py_compile tools-makhzan/video_queue/magazines.py tools-makhzan/video_queue/write_receipt.py
          python3 - <<'PY'
          import importlib.util, tempfile, json
          from pathlib import Path
          p=Path('tools-makhzan/video_queue/magazines.py')
          spec=importlib.util.spec_from_file_location('magazines',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as d:
              root=Path(d)/'artin-course-001'
              (root/'entries').mkdir(parents=True)
              (root/'receipts').mkdir()
              (root/'MANIFEST.json').write_text(json.dumps(dict(schema=m.SCHEMA,magazine_id='artin-course-001',title_fa='Artin',submitted_by_user=True,session_mode='serial',start_sequence=3,target_course_registry=m.ARTIN_COURSE)))
              for n in (3,4):
                  q=f'video-q-{n:04d}-artin-test'
                  u=f'https://my.uupload.ir/p/test{n}'
                  (root/'entries'/f'{q}.json').write_text(json.dumps(dict(schema=m.ENTRY_SCHEMA,magazine_id='artin-course-001',queue_id=q,sequence=n,submitted_by_user=True,status='PENDING_USER_AUTHORIZED',source_page=u,video_name_fa=f'Film {n}')))
              q='video-q-0003-artin-test'
              receipt=root/'receipts'/f'{q}.json'
              for attempts in (1,2):
                  receipt.write_text(json.dumps(dict(magazine_id='artin-course-001',queue_id=q,source_page='https://my.uupload.ir/p/test3',status=m.RECEIPT_FAILED,failure_attempts=attempts)))
                  got=m.read_magazine(root)
                  assert len(got)==1 and got[0]['queue_id']==q,got
              receipt.write_text(json.dumps(dict(magazine_id='artin-course-001',queue_id=q,source_page='https://my.uupload.ir/p/test3',status=m.RECEIPT_FAILED,failure_attempts=3)))
              try: m.read_magazine(root)
              except ValueError as e: assert 'three times' in str(e),e
              else: raise AssertionError('Third failure did not stop')
              receipt.write_text(json.dumps(dict(magazine_id='artin-course-001',queue_id=q,source_page='https://my.uupload.ir/p/test3',status=m.RECEIPT_OK,source_evidence={'verified':True})))
              got=m.read_magazine(root)
              assert len(got)==1 and got[0]['queue_id']=='video-q-0004-artin-test',got
          print('ARTIN_SERIAL_QUEUE_RETRY_TESTS_PASSED')
          PY
      - name: Verify canonical Artin course registry is contiguous before retry
        run: |
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,'tools-makhzan')
          from course_stitcher import validate_course
          from pathlib import Path
          doc=json.loads(Path('tools-makhzan/courses/artin/COURSE_REGISTRY.json').read_text())
          validate_course(doc)
          sessions=doc['registered_sessions']
          assert all(row['sequence']==i for i,row in enumerate(sessions,1))
          print('ARTIN_REGISTERED_CONTIGUOUS_SESSIONS='+str(len(sessions)))
          PY
      - name: Validate latest magazine receipts and select one, never skip a failure
        id: queue
        run: |
          python3 -m py_compile tools-makhzan/video_queue/load_queue.py tools-makhzan/video_queue/magazines.py
          python3 -u tools-makhzan/video_queue/load_queue.py --github-output "$GITHUB_OUTPUT"
      - name: Record queue information without personal speech or video
        run: |
          echo 'Queue scanned; user-supplied films only. Source content is not certified by this step.' >> "$GITHUB_STEP_SUMMARY"
  process-one-user-submitted-film:
    needs: find-next-authorized-video
    if: ${{ needs.find-next-authorized-video.outputs.count != '0' }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.find-next-authorized-video.outputs.items) }}
    uses: aminzare121-maker/amin-faraz/.github/workflows/tools-makhzan-video001-v13-reusable.yml@tools-makhzan-hub
    with:
      magazine_id: ${{ matrix.magazine_id }}
      queue_id: ${{ matrix.queue_id }}
      source_page: ${{ matrix.source_page }}
      expected_sha256: ${{ matrix.expected_sha256 }}
