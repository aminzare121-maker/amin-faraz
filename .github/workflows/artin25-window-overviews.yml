name: Artin selected-window overview batch without re-extraction models
on:
  push:
    branches: [audit/artin25-cloud-evidence-20261109]
    paths: [.github/workflows/artin25-window-overviews.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: artin25-existing-selected-window-overviews
  cancel-in-progress: false
jobs:
  prepare-selected-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        sequence: [6,7,9]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install media viewer tools on cloud
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Prepare overview at existing text anchors only
        env:
          GH_TOKEN: ${{ github.token }}
          SEQUENCE: ${{ matrix.sequence }}
        run: python3 audit/artin25-cloud/build_window_overviews.py
      - name: Preserve private time-linked frames and uncertainty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artin25-window-overview-${{ matrix.sequence }}-PRIVATE
          path: review/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
