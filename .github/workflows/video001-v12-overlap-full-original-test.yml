name: VIDEO001 V12 speed-overlap REAL 80min benchmark (ISOLATED)
on:
  push:
    branches: [experiment/video001-v12-overlap-guard-20261108]
    paths: [experiments/video001-v12-overlap/requests/current.json, .github/workflows/video001-v12-overlap-full-original-test.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: video001-v12-overlap-real-benchmark
  cancel-in-progress: true
jobs:
  source-once:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      asr_count: ${{ steps.prep_meta.outputs.asr_count }}
      ocr_count: ${{ steps.prep_meta.outputs.ocr_count }}
      asr_matrix: ${{ steps.prep_meta.outputs.asr_matrix }}
      ocr_matrix: ${{ steps.prep_meta.outputs.ocr_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record actual isolated benchmark run URL for verifiable follow-up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 56 --repo "${GITHUB_REPOSITORY}" --body "آزمون مستقل کامل فیلم ۸۰ دقیقه‌ای روش V2 (بدون تغییر V12) شروع شد: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} — این پیام تأیید موفقیت نیست؛ تا پایان پردازش و کنترل هش باید بررسی شود." || true
      - name: Install original movie tools without changing ASR or OCR
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Download original user MP4 ONCE and preserve ALL original audio + image evidence
        working-directory: research/artin-film-engine-v3-1
        run: |
          python3 -u video001_fast_remote_prep_v2.py --request ../../experiments/video001-v12-overlap/requests/current.json --out /tmp/video001_fast
      - name: Determine actual source chunks and screenshot worker sets
        id: prep_meta
        run: |
          python3 - <<'PY'
          import json,os
          p='/tmp/video001_fast/prepared/safe_source_prep_summary.json'
          m=json.load(open(p))
          a=m['source_audio_worker_count'];o=m['original_ocr_workers']
          assert 1<=a<=17 and 1<=o<=16 and m['source_integrity_verified']
          outputs={'asr_count':a,'ocr_count':o,'asr_matrix':list(range(a)),'ocr_matrix':list(range(o))}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in outputs.items():f.write(k+'='+json.dumps(v,separators=(',',':'))+'\n')
          print('VIDEO001_FAST_SOURCE_WORKER_COUNT='+json.dumps({'audio':a,'ocr':o}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: video001-fast-original-board
          path: /tmp/video001_fast/prepared/board_review/**
          retention-days: 15
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: video001-fast-original-chat-index
          path: /tmp/video001_fast/prepared/full_chat/chat_selected_index.json
          retention-days: 15
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: video001-fast-source-summary
          path: /tmp/video001_fast/prepared/safe_source_prep_summary.json
          retention-days: 15
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ contains(fromJSON(steps.prep_meta.outputs.asr_matrix), 0) }}
        with:
          name: video001-fast-original-audio-0
          path: /tmp/video001_fast/prepared/asr_shards/worker_00/**
          retention-days: 7
          compression-level: 2
