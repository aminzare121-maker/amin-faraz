name: Artin V13 Windows MetaEditor compile-gate V3 (offline contract only)
on:
  push:
    branches:
      - artin-v13-under180-development
    paths:
      - 'ArtinV13_ShadowProbe_RecoveryV2_DemoOnly.mq5'
      - 'compile_artin_v13_shadow.ps1'
      - 'compile_artin_v13_shadow.cmd'
      - 'artin_compile_receipt_verifier.py'
      - 'test_artin_compile_check_v3.py'
      - 'MANIFEST.json'
      - '.github/workflows/artin-v13-mt5-compile-gate-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-order-compile-receipt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run normal offline compile-receipt integrity tests (NOT a MetaEditor compile)
        shell: bash
        run: python -m unittest -v test_artin_compile_check_v3
      - name: Run optimized offline compile-receipt integrity tests (NOT a MetaEditor compile)
        shell: bash
        run: python -O -m unittest -v test_artin_compile_check_v3

  windows-powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell source (no MetaEditor available)
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $scriptPath = Join-Path $PWD 'compile_artin_v13_shadow.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            throw 'PowerShell script has syntax errors'
          }
          Write-Host 'PowerShell 5.1 syntax parse PASS; not a MetaEditor compilation.'
      - name: Verify repo source is identical except the historic final LF
        shell: powershell
        run: |
          $path = Join-Path $PWD 'ArtinV13_ShadowProbe_RecoveryV2_DemoOnly.mq5'
          [byte[]]$raw = [System.IO.File]::ReadAllBytes($path)
          if ($raw.Length -eq 0) { throw 'Empty MQ5 source' }
          # Git on windows-latest may checkout LF text as CRLF; normalize ONLY
          # CRLF to LF, then accept exactly the single historic missing final LF.
          $encoder = [System.Text.UTF8Encoding]::new($false, $true)
          $normalized = $encoder.GetString($raw).Replace("`r`n","`n")
          if (-not $normalized.EndsWith("`n")) { $normalized += "`n" }
          [byte[]]$bytes = $encoder.GetBytes($normalized)
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $digest = [System.BitConverter]::ToString($sha.ComputeHash($bytes)).Replace('-', '').ToLowerInvariant()
          Write-Host ("SHA256 canonical: " + $digest + "; raw=" + $raw.Length + "; canonical=" + $bytes.Length)
          if ($digest -ne '66f65c92275999e41835a1c414263cf7c5dd0ef4ea219dbef0e96b030bdcd361') {
            throw 'Source has changed beyond the historic GitHub final newline'
          }
          Write-Host 'V2 source content matches pinned original ZIP byte-for-byte after one terminal LF.'

      - name: Run fail-closed missing-MetaEditor branch on real Windows PowerShell
        shell: powershell
        run: |
          $tempDir = Join-Path $env:RUNNER_TEMP 'artin-v3-compile-negative'
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          $original = Join-Path $PWD 'ArtinV13_ShadowProbe_RecoveryV2_DemoOnly.mq5'
          [byte[]]$raw = [System.IO.File]::ReadAllBytes($original)
          $encoder = [System.Text.UTF8Encoding]::new($false, $true)
          $normalized = $encoder.GetString($raw).Replace("`r`n","`n")
          if (-not $normalized.EndsWith("`n")) { $normalized += "`n" }
          [System.IO.File]::WriteAllBytes((Join-Path $tempDir 'ArtinV13_ShadowProbe_RecoveryV2_DemoOnly.mq5'), $encoder.GetBytes($normalized))
          $script = Join-Path $tempDir 'compile_artin_v13_shadow.ps1'
          Copy-Item -LiteralPath (Join-Path $PWD 'compile_artin_v13_shadow.ps1') -Destination $script -Force
          $arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + $script + '" -MetaEditorPath "Z:\ARTIN_NOT_INSTALLED\metaeditor64.exe"'
          $process = Start-Process -FilePath 'powershell.exe' -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 1) { throw 'Expected fail-closed exit code 1 when compiler unavailable' }
          $receiptPath = Join-Path $env:LOCALAPPDATA 'ArtinV13\compile-check-v3\artin_v13_metaeditor_compile_receipt.json'
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ($receipt.status -ne 'BLOCKED_NOT_COMPILED') { throw 'Unexpected success claim without MetaEditor' }
          if ($receipt.error -notlike 'METAEDITOR_NOT_FOUND*') { throw 'Wrong stop reason: ' + $receipt.error }
          if ($receipt.source_sha256_verified -ne $true) { throw 'Pinned source was not verified' }
          if ($receipt.ex5_sha256 -ne $null -or $receipt.mt5_orders_sent -ne 0) { throw 'Unsafe EX5/order claim' }
          Write-Host 'PASS: Windows PowerShell fails closed when no real MetaEditor is found; no EX5 and no trade.'
