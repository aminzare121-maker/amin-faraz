name: Diagnose Amin APK on fresh Android 13 emulator (not a real phone)
on:
  pull_request:
    paths:
      - 'amin-ai-support/android-client/**'
      - '.github/workflows/amin-android13-install-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amin-android13-install-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fresh-android-13-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Confirm Android emulator hardware acceleration
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo "::error::This GitHub runner lacks /dev/kvm; APK INSTALLATION HAS NOT BEEN TESTED."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Build isolated Android APK
        working-directory: amin-ai-support/android-client
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify actual install and launch against fresh Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            APK="amin-ai-support/android-client/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            echo "INSTALLING ON A CLEAN API-33 EMULATOR, NOT OWNER'S GALAXY"
            adb install -r "$APK"
            adb shell pm path com.amin.support.mobile.compat
            adb shell am start -W -n com.amin.support.mobile.compat/com.amin.support.mobile.MainActivity
            echo "EMULATOR INSTALL AND ACTIVITY LAUNCH SUCCEEDED"
