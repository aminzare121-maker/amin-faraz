name: XAUUSD M1 Dukascopy coverage pilot
on:
  push:
    branches: [research/v5-execution-audit-20261115]
    paths:
      - 'research/dukascopy_m1_download.py'
      - '.github/workflows/xauusd-m1-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download one-day pilot and audit every hour
        run: python research/dukascopy_m1_download.py --start 2026-11-03 --end 2026-11-04 --retries 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xauusd-m1-coverage-pilot
          path: |
            research/data/dukascopy_xauusd_m1.csv
            research/data/dukascopy_xauusd_m1.coverage.json
          retention-days: 7
