      - 'artin_packet_coverage_v2.py'
      - 'test_artin_packet_coverage_public.py'
      - 'artin_citation_scope_packet_v3.py'
      - 'test_artin_citation_scope_packet_v3_public.py'
      - 'artin_citation_scope_ui_v4.py'
      - 'test_artin_citation_scope_ui_v4_public.py'
      - 'artin_citation_scoped_playback_v5.py'
      - 'test_artin_citation_scoped_playback_v5_public.py'
