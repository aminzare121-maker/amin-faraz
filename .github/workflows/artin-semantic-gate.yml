      - 'test_artin_13_real_m15_gap_audit.py'
      - 'artin_historical_context_integrity_gate.py'
      - 'test_artin_historical_context_integrity_gate.py'
      - 'artin_merge_25_course_source_evidence.py'
      - 'test_artin_merge_25_course_source_evidence.py'
      - 'artin_negated_entry_provenance_gate.py'
      - 'test_artin_negated_entry_provenance_gate.py'
      - 'artin_negated_entry_provenance_gate_v2.py'
      - 'test_artin_negated_entry_provenance_gate_v2.py'
      - 'artin_negative_context_packets.py'
      - 'test_artin_negative_context_packets.py'
      - 'artin_24_full_context_integrity.py'
      - 'test_artin_24_context_membership_public.py'
