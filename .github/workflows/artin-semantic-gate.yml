name: Artin semantic gate unit tests
on:
  push:
    branches:
      - artin-v13-under180-development
    paths:
      - 'artin_semantic_gate.py'
      - 'test_artin_semantic_gate.py'
      - 'test_artin_interval_differential.py'
      - 'artin_semantic_gate_v2.py'
      - 'test_artin_semantic_gate_v2.py'
      - 'artin_replay_stage.py'
      - 'test_artin_replay_stage.py'
      - 'artin_full_review_queue.py'
      - 'test_artin_full_review_queue.py'
      - 'artin_review_packets.py'
      - 'test_artin_review_packets.py'
      - 'artin_full_coverage_index.py'
      - 'test_artin_full_coverage_index.py'
      - 'test_artin_teacher_scenario_replay.py'
      - 'artin_teacher_scenario_replay.py'
      - 'test_artin_teacher_case_provenance.py'
      - 'artin_teacher_case_provenance.py'
      - 'artin_visual_supplement.py'
      - 'test_artin_visual_supplement.py'
      - 'artin_technical_speech_inventory.py'
      - 'test_artin_technical_speech_inventory.py'
      - 'artin_source_hierarchy.py'
      - 'test_artin_source_hierarchy.py'
      - 'artin_eplanet_m15_preflight.py'
      - 'test_artin_eplanet_m15_preflight.py'
      - 'artin_real_m15_observation_replay.py'
      - 'test_artin_real_m15_observation_replay.py'
      - 'artin_eplanet_monthly_evidence.py'
      - 'test_artin_eplanet_monthly_evidence.py'
      - 'artin_teacher_market_observability.py'
      - 'test_artin_teacher_market_observability.py'
      - 'artin_13_source_coverage_audit.py'
      - 'test_artin_13_source_coverage_audit.py'
      - 'artin_teacher_citation_duration_guard.py'
      - 'test_artin_teacher_citation_duration_guard.py'
      - 'artin_legacy_identity_reconciliation.py'
      - 'test_artin_legacy_identity_reconciliation.py'
      - 'artin_restore_six_archived_speech_windows.py'
      - 'test_artin_restore_six_archived_speech_windows.py'
      - 'artin_six_source_context_guard.py'
      - 'test_artin_six_source_context_guard.py'
      - 'artin_original_visual_time_gate.py'
      - 'test_artin_original_visual_time_gate.py'
      - 'artin_13_real_m15_gap_audit.py'
      - 'test_artin_13_real_m15_gap_audit.py'
      - 'artin_historical_context_integrity_gate.py'
      - 'test_artin_historical_context_integrity_gate.py'
      - 'artin_merge_25_course_source_evidence.py'
      - 'test_artin_merge_25_course_source_evidence.py'
      - 'artin_negated_entry_provenance_gate.py'
      - 'test_artin_negated_entry_provenance_gate.py'
      - 'artin_negated_entry_provenance_gate_v2.py'
      - 'test_artin_negated_entry_provenance_gate_v2.py'
      - 'artin_negative_context_packets.py'
      - 'test_artin_negative_context_packets.py'
      - 'artin_24_full_context_integrity.py'
      - 'test_artin_24_context_membership_public.py'
      - '.github/workflows/artin-semantic-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed semantic gate tests
        shell: bash
        run: |
          failed=0
          for suite in test_artin_semantic_gate.py test_artin_interval_differential.py test_artin_semantic_gate_v2.py test_artin_replay_stage.py test_artin_full_review_queue.py test_artin_review_packets.py test_artin_full_coverage_index.py test_artin_teacher_case_provenance.py test_artin_teacher_scenario_replay.py test_artin_visual_supplement.py test_artin_technical_speech_inventory.py test_artin_source_hierarchy.py test_artin_eplanet_m15_preflight.py test_artin_real_m15_observation_replay.py test_artin_eplanet_monthly_evidence.py test_artin_teacher_market_observability.py test_artin_13_source_coverage_audit.py test_artin_teacher_citation_duration_guard.py test_artin_legacy_identity_reconciliation.py test_artin_restore_six_archived_speech_windows.py test_artin_six_source_context_guard.py test_artin_original_visual_time_gate.py test_artin_13_real_m15_gap_audit.py test_artin_historical_context_integrity_gate.py test_artin_merge_25_course_source_evidence.py test_artin_negated_entry_provenance_gate.py test_artin_negated_entry_provenance_gate_v2.py test_artin_negative_context_packets.py test_artin_24_context_membership_public.py; do
            echo "::group::${suite}"
            if python3 -m unittest -v "$suite"; then
              echo "PASS: $suite"
            else
              echo "::error title=Artin suite failed::$suite"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
