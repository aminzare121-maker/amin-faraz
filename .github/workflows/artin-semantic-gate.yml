      - 'artin_14_pair_source_reconciliation.py'
      - 'test_artin_14_pair_source_reconciliation.py'
      - 'artin_14_pair_time_identity.py'
      - 'test_artin_14_pair_time_identity_public.py'
      - 'build_artin_14_pair_original_mp4_review.py'
      - 'artin_reconstruct_3_historical_wavs.py'
      - 'artin_upgrade_14_pair_exact_sources.py'
      - 'test_artin_upgrade_14_pair_exact_sources_public.py'
      - 'artin_14_machine_conflict_triage_v2.py'
      - 'artin_14_machine_triage_review_packet_v2.py'
      - 'test_artin_14_machine_conflict_triage_v2_public.py'
      - 'artin_9_context_review_packet.py'
      - 'artin_9_visual_context_gate.py'
      - 'test_artin_9_visual_context_gate_public.py'
      - 'artin_9_two_episode_review.py'
      - 'artin_9_episode_validation.py'
      - 'test_artin_9_episode_validation_public.py'
      - 'artin_9_scene_timeline.py'
      - 'test_artin_9_scene_timeline_public.py'
      - '.github/workflows/artin-semantic-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed semantic gate tests
        shell: bash
        run: |
          failed=0
          for suite in test_artin_semantic_gate.py test_artin_interval_differential.py test_artin_semantic_gate_v2.py test_artin_replay_stage.py test_artin_full_review_queue.py test_artin_review_packets.py test_artin_full_coverage_index.py test_artin_teacher_case_provenance.py test_artin_teacher_scenario_replay.py test_artin_visual_supplement.py test_artin_technical_speech_inventory.py test_artin_source_hierarchy.py test_artin_eplanet_m15_preflight.py test_artin_real_m15_observation_replay.py test_artin_eplanet_monthly_evidence.py test_artin_teacher_market_observability.py test_artin_13_source_coverage_audit.py test_artin_teacher_citation_duration_guard.py test_artin_legacy_identity_reconciliation.py test_artin_restore_six_archived_speech_windows.py test_artin_six_source_context_guard.py test_artin_original_visual_time_gate.py test_artin_13_real_m15_gap_audit.py test_artin_historical_context_integrity_gate.py test_artin_merge_25_course_source_evidence.py test_artin_negated_entry_provenance_gate.py test_artin_negated_entry_provenance_gate_v2.py test_artin_negative_context_packets.py test_artin_24_context_membership_public.py test_artin_restored_av_window_gate_v2_public.py test_artin_video20_scene_boundary.py test_artin_video20_citation_scene_guard.py test_artin_packet_coverage_public.py test_artin_citation_scope_packet_v3_public.py test_artin_citation_scope_ui_v4_public.py test_artin_citation_scoped_playback_v5_public.py test_artin_13_teacher_acceptance_public.py test_artin_13_decision_conflict_public.py test_artin_conflict_media_provenance.py test_artin_14_pair_source_reconciliation.py test_artin_14_pair_time_identity_public.py test_artin_upgrade_14_pair_exact_sources_public.py test_artin_14_machine_conflict_triage_v2_public.py test_artin_9_visual_context_gate_public.py test_artin_9_episode_validation_public.py test_artin_9_scene_timeline_public.py; do
            echo "::group::${suite}"
            if python3 -m unittest -v "$suite"; then
              echo "PASS: $suite"
            else
              echo "::error title=Artin suite failed::$suite"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Validate real-cycle receipt audit (unit tests only; no performance claim)
        shell: bash
        run: python3 -m unittest -v test_artin_real_cycle_receipt_gate

      - name: Validate file-backed receipt provenance (unit tests only)
        shell: bash
        run: python3 -m unittest -v test_artin_receipt_provenance_gate

      - name: Run interval differential oracle with optimized Python
        shell: bash
        run: |
          # Python -O disables assert statements; unittest assertions must still execute.
          # This verifies the interval matcher does not depend on debug-only checks.
          python3 -O -m unittest -v test_artin_interval_differential

      - name: Run optimized AV fail-closed regression tests
        shell: bash
        run: |
          python3 -O -m unittest -v test_artin_restored_av_window_gate_v2_public

      - name: Run scene boundary gate with optimized Python
        shell: bash
        run: python3 -O -m unittest -v test_artin_video20_scene_boundary

      - name: Run optimized citation scene gate
        shell: bash
        run: python3 -O -m unittest -v test_artin_video20_citation_scene_guard

      - name: Run optimized playable audio coverage gate
        shell: bash
        run: python3 -O -m unittest -v test_artin_packet_coverage_public

      - name: Run optimized citation scope classification tests
        shell: bash
        run: python3 -O -m unittest -v test_artin_citation_scope_packet_v3_public

      - name: Run optimized v4 utterance scope UI tests
        shell: bash
        run: python3 -O -m unittest -v test_artin_citation_scope_ui_v4_public

      - name: Run optimized v5 citation playback tests
        shell: bash
        run: python3 -O -m unittest -v test_artin_citation_scoped_playback_v5_public

      - name: Run optimized teacher acceptance preflight
        shell: bash
        run: python3 -O -m unittest -v test_artin_13_teacher_acceptance_public

      - name: Run optimized 13-route conflict-review tests
        shell: bash
        run: python3 -O -m unittest -v test_artin_13_decision_conflict_public

      - name: Run optimized conflict media provenance tests
        shell: bash
        run: python3 -O -m unittest -v test_artin_conflict_media_provenance

      - name: Run optimized original WAV source reconciliation tests
        shell: bash
        run: python3 -O -m unittest -v test_artin_14_pair_source_reconciliation

      - name: Run optimized source interval ID identity tests
        shell: bash
        run: python3 -O -m unittest -v test_artin_14_pair_time_identity_public

      - name: Run optimized exact historical WAV guard
        shell: bash
        run: python3 -O -m unittest -v test_artin_upgrade_14_pair_exact_sources_public

      - name: Run optimized Artin Persian lexical triage V2 tests
        shell: bash
        run: python3 -O -m unittest -v test_artin_14_machine_conflict_triage_v2_public

      - name: Run optimized 9 original AV review visual safety tests
        shell: bash
        run: python3 -O -m unittest -v test_artin_9_visual_context_gate_public

      - name: Run optimized two-episode original AV provenance tests
        shell: bash
        run: python3 -O -m unittest -v test_artin_9_episode_validation_public

      - name: Run optimized 1-Hz source video screen-change tests
        shell: bash
        run: python3 -O -m unittest -v test_artin_9_scene_timeline_public
